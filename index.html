  {"id": "2026-07-08-012", "date": "2026-07-08", "source": "The Information", "newsletter": "The Information (article alert)", "title": "AI Borrowers Tap a $3.5 Trillion Market Hiding in Plain Sight", "summary": "The Information reports that AI infrastructure companies are increasingly turning to a large but little-scrutinized corner of the bond market to finance data center buildouts, as traditional equity and venture funding falls short of the trillions of dollars needed for AI compute expansion. The financing shift raises questions among analysts about credit-risk concentration tied to AI infrastructure debt.", "link": null, "category": "Markets & Finance", "also_covered_by": [], "priority_pick": false},
  {"id": "2026-07-08-013", "date": "2026-07-08", "source": "The Information", "newsletter": "The Information (article alert)", "title": "China Plans to Let Top AI Firms Buy Limited Amount of Nvidia H200 Chips", "summary": "China plans to allow its top AI companies to purchase a limited quantity of Nvidia's H200 chips, The Information reports, as Beijing works to balance domestic chip-supply concerns with AI firms' need for advanced computing hardware. The move follows a period in which Chinese authorities had restricted or paused approvals for H200 purchases pending government review.", "link": "https://www.theinformation.com/articles/china-plans-let-top-ai-firms-buy-limited-amount-nvidia-h200-chips", "category": "Technology & AI", "also_covered_by": [], "priority_pick": false},
  {"id": "2026-07-08-014", "date": "2026-07-08", "source": "The Information", "newsletter": "The Information (article alert)", "title": "Nvidia's New Hedge Against Chip Competitors: Partner With Them", "summary": "Nvidia is increasingly partnering with rival AI chipmakers rather than competing head-on, including a new joint hardware system with startup d-Matrix, and a new server rack architecture designed to run chips from Nvidia or its competitors. The Information frames this as a hedging strategy to maintain Nvidia's central role in AI infrastructure even as more chip rivals emerge.", "link": "https://www.theinformation.com/articles/nvidias-new-hedge-chip-competitors-partner", "category": "Technology & AI", "also_covered_by": [], "priority_pick": false},
  {"id": "2026-07-08-015", "date": "2026-07-08", "source": "The Information", "newsletter": "The Information (article alert)", "title": "The Prolonged Write-Downs in Enterprise Software Startups", "summary": "The Information reports that Wall Street's sell-off of enterprise software stocks resumed last week, with shares of companies including ServiceNow and Snowflake falling around 8% amid growing investor concern that AI tools are eroding demand for traditional enterprise software. The piece cites Atlanta-based real estate manager Greenleaf Management, which saved roughly $100,000 annually by replacing its Salesforce CRM with a custom application built using Replit and Claude Code.", "link": null, "category": "Business & Strategy", "also_covered_by": [], "priority_pick": false},
  {"id": "2026-07-08-016", "date": "2026-07-08", "source": "The Logic", "newsletter": "The Logic Briefing", "title": "Meta Lifts the Veil on Its $13-Billion Alberta Data Centre", "summary": "Meta announced plans to build a 2.9-million-square-foot, 1-gigawatt data center in Sturgeon County, Alberta, north of Edmonton, representing an investment of more than $13 billion and the company's first data centre in Canada. The project, expected to create more than 3,000 construction jobs and 300 permanent operational roles, is among the largest private-sector investments in Canadian history, and Meta says it will match the facility's energy use with renewable generation.", "link": null, "category": "Canadian Business", "also_covered_by": [], "priority_pick": false},
  {"id": "2026-07-08-017", "date": "2026-07-08", "source": "The Logic", "newsletter": "The Logic Briefing", "title": "Air Canada Names Anko Van der Werff as New CEO", "summary": "Air Canada announced that Anko Van der Werff, currently president and CEO of Scandinavian Airlines (SAS), will become the airline's next president and CEO, succeeding Michael Rousseau, who is retiring after 19 years with the company effective August 31, 2026. Van der Werff previously led Avianca and brings more than 25 years of international airline leadership experience.", "link": null, "category": "Canadian Business", "also_covered_by": [], "priority_pick": false},
  {"id": "2026-07-08-018", "date": "2026-07-08", "source": "Broadcom / Apple", "newsletter": "SmartBrief on Connectivity", "title": "Apple's $30 Billion Chip Deal With Broadcom Explained", "summary": "Apple and Broadcom announced a multiyear agreement worth more than $30 billion for Broadcom to manufacture over 15 billion U.S.-made chips for Apple devices, including custom silicon, RF filters and wireless connectivity components, through at least 2031. Broadcom will invest $1.5 billion in its Colorado facility as part of the deal, described as Apple's largest domestic manufacturing commitment to date and a hedge against geopolitical and trade-policy risk in its chip supply chain.", "link": "https://www.macrumors.com/2026/07/08/apple-announces-30-billion-broadcom-deal/", "category": "Business & Strategy", "also_covered_by": [], "priority_pick": false},
  {"id": "2026-07-08-019", "date": "2026-07-08", "source": "Mobile World Live", "newsletter": "Mobile World Live", "title": "Ex-AT&T Exec to Join T-Mobile US", "summary": "T-Mobile US announced that Chris Sambar, a more than two-decade veteran of AT&T, will join the company as Chief Enterprise Officer no later than October 14, 2026, to lead its small business, enterprise and government sales operations. The hire is part of a broader leadership reshuffle at T-Mobile that includes the departure of Chief Business and Product Officer Michael Katz.", "link": "https://www.mobileworldlive.com/t-mobile-us/ex-att-exec-to-join-t-mobile-us/", "category": "Business & Strategy", "also_covered_by": [], "priority_pick": false},
  {"id": "2026-07-08-020", "date": "2026-07-08", "source": "Mobile World Live", "newsletter": "Mobile World Live", "title": "Apple Loses EU Court Fight Over App Store, iOS", "summary": "The EU's General Court dismissed Apple's challenge to the European Commission's designation of its App Stores and iOS as \"gatekeeper\" platforms under the Digital Markets Act, in a ruling issued July 8, 2026. The designation requires Apple to permit alternative app stores and avoid favoring its own services, and the court separately ruled Apple's related challenge over an iMessage investigation was inadmissible.", "link": "https://www.mobileworldlive.com/apple/apple-loses-eu-court-fight-over-app-store-ios/", "category": "Politics & Policy", "also_covered_by": [], "priority_pick": false},
  {"id": "2026-07-08-021", "date": "2026-07-08", "source": "The Information", "newsletter": "The Information Briefing", "title": "SpaceX's AI Advances", "summary": "SpaceX's AI division (formerly xAI) is rolling out AI products aimed at businesses, building on its Grok chatbot and Colossus supercomputer infrastructure. The unit has signed major compute deals, including one with Anthropic worth roughly $1.25 billion per month through 2029, and is exploring new offerings such as no-code voice-agent tools and orbital data centers.", "link": null, "category": "Technology & AI", "also_covered_by": [], "priority_pick": false},
  {"id": "2026-07-07-001", "date": "2026-07-07", "source": "Wall Street Journal", "newsletter": "WSJ Morning Download", "title": "Microsoft to Cut 4,800 Jobs, Mostly in Xbox and Sales", "summary": "Microsoft is laying off about 4,800 employees, roughly 2% of its workforce, primarily in its sales organization and Xbox gaming division. Xbox will cut 1,600 roles immediately and sell at least four game studios, with CEO Asha Sharma telling staff the unit \"is not healthy\" and operates at margins 3-10x lower than comparable businesses.", "link": "https://www.wsj.com/tech/microsoft-layoffs-xbox-59e7f6df", "category": "Business & Strategy", "also_covered_by": ["The Briefing", "The Information AM", "The Rundown Tech"], "priority_pick": true},
  {"id": "2026-07-07-002", "date": "2026-07-07", "source": "The Information", "newsletter": "The Information AM", "title": "Broadcom and Apple Extend Tech Collaboration Through 2031", "summary": "Broadcom and Apple agreed to extend their custom-chip collaboration through 2031 under new multiyear agreements disclosed in a securities filing. The deal reinforces Broadcom's role as a key networking-chip partner for Apple's AI server hardware, and sent Broadcom shares up 4% in premarket trading.", "link": "https://www.theinformation.com/briefings/broadcom-apple-extend-tech-collaboration-2031", "category": "Technology & AI", "also_covered_by": ["The Briefing", "Mobile World Live", "The Rundown Tech"], "priority_pick": false},
  {"id": "2026-07-07-003", "date": "2026-07-07", "source": "Wall Street Journal", "newsletter": "WSJ Morning Download", "title": "AI Enters a New Stage of Financial Innovation as Debt Markets Swell", "summary": "Research firm SemiAnalysis projects that AI debt financing will grow into a multi-trillion-dollar credit market, with more than $7 trillion outstanding by 2029, rivaling the US mortgage-backed securities market. The report argues hyperscalers' balance sheets alone cannot backstop that scale of borrowing, so neoclouds and AI labs need to broaden their customer base beyond a handful of large cloud providers to sustain data-center financing.", "link": null, "category": "Markets & Finance", "also_covered_by": [], "priority_pick": false},
  {"id": "2026-07-07-004", "date": "2026-07-07", "source": "Wall Street Journal", "newsletter": "WSJ Morning Download", "title": "AI Infrastructure Startup Nscale Secures $900 Million for Data-Center Buildout", "summary": "Nvidia-backed AI infrastructure startup Nscale secured a $900 million line of credit to expand data-center capacity across Europe, the US, and Asia-Pacific. The company, also backed by Dell and Nokia, had raised $2 billion earlier this year at a $14.6 billion valuation.", "link": "https://www.wsj.com/tech/ai/nvidia-backed-startup-nscale-locks-in-900-million-for-data-center-buildout-fd9820b3", "category": "Technology & AI", "also_covered_by": [], "priority_pick": false},
  {"id": "2026-07-07-005", "date": "2026-07-07", "source": "Wall Street Journal", "newsletter": "WSJ Morning Download", "title": "Samsung Forecasts Record Second-Quarter Operating Profit", "summary": "Samsung Electronics projected a record second-quarter operating profit of about $58.47 billion, roughly 19 times higher year-over-year, driven by surging demand for AI memory chips and strong server DRAM pricing. The forecast comes amid broader market jitters over whether AI infrastructure spending is sustainable.", "link": "https://www.wsj.com/tech/samsung-forecasts-record-second-quarter-operating-profit-8b95a398", "category": "Markets & Finance", "also_covered_by": ["Mobile World Live"], "priority_pick": false},
  {"id": "2026-07-07-006", "date": "2026-07-07", "source": "Wall Street Journal", "newsletter": "WSJ Heard on the Street", "title": "Why SK Hynix Isn't as Cheap as It Looks", "summary": "SK Hynix, which is preparing to raise about $28 billion in a US listing this week, has become one of the world's most profitable companies, with analysts projecting nearly $150 billion in net income this year, up from losses three years ago. Despite its stock more than tripling in 2026, the shares trade at a forward P/E of around 7, reflecting investor wariness that the memory industry's historically cyclical downturns will eventually follow the current AI-driven upturn.", "link": null, "category": "Markets & Finance", "also_covered_by": [], "priority_pick": false},
  {"id": "2026-07-07-007", "date": "2026-07-07", "source": "Wall Street Journal", "newsletter": "WSJ Latest in Artificial Intelligence", "title": "Nokia's New Act: Supplying the AI Data Center Boom", "summary": "Nokia shares have surged roughly 90% this year as the company pivots from its legacy handset business to become a major supplier of AI data-center infrastructure equipment.", "link": "https://www.wsj.com/tech/ai/nokias-new-act-supplying-the-ai-data-center-boom-e03045c0", "category": "Technology & AI", "also_covered_by": [], "priority_pick": false},
  {"id": "2026-07-07-008", "date": "2026-07-07", "source": "Wall Street Journal", "newsletter": "WSJ Latest in Artificial Intelligence", "title": "Will Someone Finally Blink in the AI Spending War?", "summary": "A Wall Street Journal analysis asks whether major tech companies have overbuilt AI computing capacity, noting that if Meta begins renting out its excess compute to other businesses, it could be an early signal that AI infrastructure investment has outpaced actual demand.", "link": "https://www.wsj.com/tech/ai/will-someone-finally-blink-in-the-ai-spending-war-0f59aa60", "category": "Markets & Finance", "also_covered_by": [], "priority_pick": false},
  {"id": "2026-07-07-009", "date": "2026-07-07", "source": "Wall Street Journal", "newsletter": "WSJ Latest in Artificial Intelligence", "title": "AI Giants Are Handing Out Tons of Free Computing Power to Grab Startup Share", "summary": "OpenAI, Anthropic, and other AI model developers are offering startups discounted or free cloud computing power, tokens, and early access to new models as they compete to lock in future enterprise customers. The push comes as AI labs seek durable revenue streams large enough to justify their capital-spending commitments.", "link": "https://www.wsj.com/tech/ai/ai-giants-are-handing-out-tons-of-free-computing-power-to-grab-startup-share-c00a5c5c", "category": "Technology & AI", "also_covered_by": ["WSJ Pro Cybersecurity"], "priority_pick": false},
  {"id": "2026-07-07-010", "date": "2026-07-07", "source": "Wall Street Journal", "newsletter": "WSJ Pro Cybersecurity", "title": "New Cyber Incident Reporting Rules Coming in September", "summary": "Four years after Congress passed the Cyber Incident Reporting for Critical Infrastructure Act, the Cybersecurity and Infrastructure Security Agency is expected to finalize rules in September requiring critical infrastructure operators to disclose cyberattacks. Industry groups have been lobbying CISA to align the new reporting deadlines and disclosure requirements with existing regulations.", "link": "https://www.nextgov.com/cybersecurity/2026/07/cisa-expects-finalize-key-cyber-reporting-rule-september/414607/", "category": "Politics & Policy", "also_covered_by": [], "priority_pick": false},
  {"id": "2026-07-07-011", "date": "2026-07-07", "source": "Wall Street Journal", "newsletter": "WSJ Pro Cybersecurity", "title": "US Cyber Agency Uses Anthropic's Mythos to Audit Government Code", "summary": "The Cybersecurity and Infrastructure Security Agency is using Anthropic's Mythos AI model to scan federal technology systems for vulnerabilities, according to people familiar with the matter. The arrangement comes even as Anthropic has been at odds with the White House for months over how its models can be used by the US government.", "link": "https://www.reuters.com/world/us-cyber-agency-is-using-anthropics-mythos-audit-government-code-sources-say-2026-07-06/", "category": "Politics & Policy", "also_covered_by": [], "priority_pick": false},
  {"id": "2026-07-07-012", "date": "2026-07-07", "source": "The Information", "newsletter": "Applied AI", "title": "Facing a Revolt, HubSpot Reverses Its Decision to Use Customer Data For AI Feature", "summary": "HubSpot reversed a July 1 plan to collect and potentially share customers' CRM data by default to power a new AI sales-lead feature, after customers objected publicly and threatened to switch providers. HubSpot's chief product and technology officer called the terms-of-service changes \"a mistake,\" in a reversal that echoes earlier customer-data backlashes faced by Slack and Zoom over AI training uses.", "link": null, "category": "Technology & AI", "also_covered_by": [], "priority_pick": false},
  {"id": "2026-07-07-013", "date": "2026-07-07", "source": "Reuters", "newsletter": "The Information AM", "title": "Beijing Considers Restricting Overseas Access to Top Chinese AI Models", "summary": "Chinese officials, led by the Ministry of Commerce, have discussed restricting overseas access to China's most advanced AI models, including both closed- and open-source systems, according to people familiar with the discussions. The talks also touched on possible limits on who can invest in domestic AI startups, amid a broader US-China rivalry that has seen Washington impose and partly ease export controls on Anthropic's most advanced models.", "link": "https://www.reuters.com/world/beijing-is-looking-curbing-overseas-access-chinas-top-ai-models-sources-say-2026-07-07/", "category": "Politics & Policy", "also_covered_by": [], "priority_pick": false},
  {"id": "2026-07-07-014", "date": "2026-07-07", "source": "The Information", "newsletter": "The Information AM", "title": "Mercor Hits Over $2 Billion in Gross Annualized Revenue", "summary": "AI-focused talent marketplace Mercor surpassed a $2 billion gross annualized revenue run rate in June, double its pace earlier this year, driven by rising demand from AI app developers and Fortune 500 customers building or fine-tuning their own AI models. The company pays out 60-70% of that revenue to contractors and is profitable on a free-cash-flow basis.", "link": "https://www.theinformation.com/briefings/exclusive-mercor-hit-2-billion-gross-annualized-revenue", "category": "Business & Strategy", "also_covered_by": [], "priority_pick": false},
  {"id": "2026-07-07-015", "date": "2026-07-07", "source": "The Information", "newsletter": "The Information AM", "title": "TeraWulf Shares Soar on $19 Billion Anthropic Data Center Deal", "summary": "Data-center developer TeraWulf signed a 20-year lease agreement to provide Anthropic a purpose-built AI campus in Hawesville, Kentucky, a deal expected to generate about $19 billion in contracted revenue. TeraWulf shares jumped as much as 19% intraday before closing up nearly 5%, and the company is also selling its stake in a separate joint venture.", "link": "https://www.theinformation.com/briefings/terawulf-shares-soar-19-billion-anthropic-data-center-deal", "category": "Technology & AI", "also_covered_by": ["Mobile World Live"], "priority_pick": false},
  {"id": "2026-07-07-016", "date": "2026-07-07", "source": "Mobile World Live", "newsletter": "Mobile World Live", "title": "Micron Continues Automotive Drive With Ford Deal", "summary": "Ford Motor Company and Micron Technology signed a long-term agreement for Micron to supply memory chips for next-generation vehicle production, a week after Micron announced a similar supply deal with General Motors.", "link": null, "category": "Technology & AI", "also_covered_by": [], "priority_pick": false},
  {"id": "2026-07-07-017", "date": "2026-07-07", "source": "Mobile World Live", "newsletter": "Mobile World Live", "title": "Australia Social Media Age-Checks Fall Short", "summary": "A new study reportedly found that major social media platforms are failing to consistently apply age-verification methods under Australia's landmark ban on social media accounts for under-16s, exposing early enforcement gaps in the law.", "link": null, "category": "Politics & Policy", "also_covered_by": [], "priority_pick": false},
  {"id": "2026-07-07-018", "date": "2026-07-07", "source": "The Rundown Tech", "newsletter": "The Rundown Tech", "title": "The Anti-Meta Smart Glasses Just Became a Unicorn", "summary": "Shenzhen-based smart-glasses startup Even Realities raised $150 million in a pre-Series B round led by Meituan and Tencent, reaching a $1 billion valuation. Founded by former Apple engineers, the company sells camera-free glasses with a heads-up display starting around $599, betting that privacy-focused hardware can differentiate it from Meta's and Snap's camera-equipped AI glasses.", "link": "https://techcrunch.com/2026/07/06/smart-glasses-maker-even-realities-hits-1b-valuation-with-150m-funding-led-by-meituan-tencent/", "category": "Technology & AI", "also_covered_by": ["Mobile World Live"], "priority_pick": false},
  {"id": "2026-07-07-019", "date": "2026-07-07", "source": "The Rundown Tech", "newsletter": "The Rundown Tech", "title": "Alibaba Fights the U.S. Blacklist, and Wins Round One", "summary": "A federal judge temporarily blocked the Pentagon from enforcing a new rule barring it from contracting with firms whose lobbyists also represent companies on its list of alleged Chinese military companies, pending a ruling on Alibaba's constitutional challenge. Alibaba was added to the Pentagon's expanded 188-company list in June and sued on June 23 to be removed from it.", "link": "https://www.bloomberg.com/news/articles/2026-07-05/alibaba-gets-reprieve-from-lobbying-ban-tied-to-pentagon-s-curbs", "category": "Politics & Policy", "also_covered_by": [], "priority_pick": false},
  {"id": "2026-07-07-020", "date": "2026-07-07", "source": "Wall Street Journal", "newsletter": "The Rundown Tech", "title": "Big Tech Drastically Undercounts AI's Water Use", "summary": "Microsoft, Google, and Amazon report only the water consumed directly for on-site cooling at their data centers, omitting the far larger volume evaporated at the power plants that supply their electricity, according to a Wall Street Journal analysis. Indirect water use has historically run about 12 times direct consumption, and in water-stressed Phoenix, data centers could account for more than 20% of city water use by 2031, up from about 3% today.", "link": null, "category": "Technology & AI", "also_covered_by": [], "priority_pick": false},
  {"id": "2026-07-06-001", "date": "2026-07-06", "source": "Wall Street Journal", "newsletter": "WSJ Morning Download", "title": "Big Tech Has Suddenly Flipped on the AI Jobs Wipeout Scenario", "summary": "Major technology companies have quietly softened earlier warnings that artificial intelligence would trigger sweeping job losses, as public opinion toward AI has grown more negative. Executives including OpenAI's Sam Altman and Anthropic's Dario Amodei, who previously forecast substantial workforce disruption, are now emphasizing that AI will keep workers at the center of business operations. A survey cited in the report found the share of CEOs expecting AI to cause significant headcount reductions fell from about 46% in January 2025 to 20% in May 2026.", "link": null, "category": "Technology & AI", "also_covered_by": ["WSJ Latest in Artificial Intelligence"], "priority_pick": true},
  {"id": "2026-07-06-002", "date": "2026-07-06", "source": "The Information", "newsletter": "The Information AM", "title": "OpenAI's Biggest Backers Bet on Josh Kushner's AI Roll-Up Machine", "summary": "Some of OpenAI's largest investors are reportedly putting capital behind Thrive Holdings, an AI-focused roll-up vehicle led by Thrive Capital founder Josh Kushner that buys and operates traditional services businesses. OpenAI itself has taken an ownership stake in Thrive Holdings and agreed to embed its researchers with the vehicle's portfolio companies to build customized AI models. The arrangement deepens financial ties between OpenAI's investor base and its commercial applications beyond its core chatbot business.", "link": null, "category": "Business & Strategy", "also_covered_by": [], "priority_pick": false},
  {"id": "2026-07-06-003", "date": "2026-07-06", "source": "The Logic", "newsletter": "The Logic", "title": "Smith and Ford revive push for a west-to-east oil pipeline", "summary": "Alberta Premier Danielle Smith and Ontario Premier Doug Ford are reviving efforts to build a new oil pipeline running from the Alberta oilpatch to eastern Canada, according to The Logic. The push aims to reduce Canadian reliance on the U.S. market for oil exports and follows years of stalled interprovincial pipeline proposals. Jurisdictional disputes between federal and provincial governments have historically been the main obstacle to similar projects.", "link": null, "category": "Energy & Commodities", "also_covered_by": [], "priority_pick": false},
  {"id": "2026-07-06-004", "date": "2026-07-06", "source": "CNBC", "newsletter": "SmartBrief on Connectivity", "title": "Apple's ambitious plans for 5 new iPhones by 2027", "summary": "Apple is reportedly planning to launch at least five new iPhone models between late 2026 and the first half of 2027, including its first foldable device, a standard iPhone 18, and a new iPhone Air model, according to a Nikkei Asia report cited by CNBC. The company has raised its foldable iPhone production target to roughly 10 million units, up from an earlier forecast of 7 to 8 million, with the foldable expected to be priced around $2,500. Apple has also explored Chinese chip suppliers to address AI-driven memory component shortages.", "link": "https://www.cnbc.com/2026/07/02/apple-foldable-iphone-production-memory-shortage-china-chipmakers-cxmt-ymtc.html", "category": "Technology & AI", "also_covered_by": [], "priority_pick": false},
  {"id": "2026-07-06-005", "date": "2026-07-06", "source": "The Information", "newsletter": "The Information AM", "title": "How Small Firms Use Claude to Quit Salesforce", "summary": "Small and mid-sized firms are increasingly replacing Salesforce and other traditional enterprise software with custom workflows built on Anthropic's Claude, according to The Information. The trend reflects broader unease inside Salesforce about AI assistants encroaching on core CRM functions. It points to a potential shift in how smaller businesses procure and build software as AI models take on tasks once handled by dedicated enterprise applications.", "link": "https://www.theinformation.com/articles/small-firms-use-claude-quit-salesforce", "category": "Technology & AI", "also_covered_by": [], "priority_pick": false},
  {"id": "2026-07-06-006", "date": "2026-07-06", "source": "Mobile World Live", "newsletter": "Mobile World Live", "title": "KT sets aside $12B to fuel AI platform ambition", "summary": "South Korean telecom operator KT unveiled a roughly $12 billion (KRW18 trillion) five-year investment plan to transform into what it calls an AI platform company under its new CEO. The spending is allocated across network infrastructure, IT and security, data centers, and submarine cable capacity. KT said the plan aims to build capabilities in AI, cybersecurity, and next-generation connectivity including 6G.", "link": "https://www.mobileworldlive.com/asia-pacific/kt-sets-aside-12b-to-fuel-ai-platform-ambition", "category": "Technology & AI", "also_covered_by": [], "priority_pick": false},
  {"id": "2026-07-06-007", "date": "2026-07-06", "source": "Mobile World Live", "newsletter": "Mobile World Live", "title": "SKT targets 15GW data centre capacity", "summary": "SK Telecom outlined plans to build 15 gigawatts of AI-capable data center capacity in South Korea, starting with 5GW online from 2029 and an additional 10GW from 2035. The company is positioning itself as a regional AI infrastructure hub, with an initial site in Ulsan and planned clusters in the Gyeongsang and Jeolla regions, and cited McKinsey forecasts of 19-22% annual growth in data center demand. A single gigawatt-class AI data center is estimated to cost roughly KRW70 trillion, to be financed through company investment, partner capital, and project financing.", "link": "https://www.mobileworldlive.com/asia-pacific/skt-targets-15gw-data-centre-capacity", "category": "Technology & AI", "also_covered_by": [], "priority_pick": false},
  {"id": "2026-07-06-008", "date": "2026-07-06", "source": "The Information", "newsletter": "The Information AM", "title": "Tesla expands Robotaxi service to Miami", "summary": "Tesla expanded its Robotaxi service to a section of western and central Miami, making Florida the first state outside Texas to host the fully autonomous service. Unlike Tesla's earlier Austin deployment, which used in-vehicle safety supervisors, the Miami service launched without human supervision from day one. Tesla has said it plans further expansions to Orlando, Tampa, Phoenix, and Las Vegas.", "link": "https://www.theinformation.com/briefings/tesla-expands-robotaxi-service-miami", "category": "Technology & AI", "also_covered_by": [], "priority_pick": false},
  {"id": "2026-07-06-009", "date": "2026-07-06", "source": "The Information", "newsletter": "The Information AM", "title": "Alibaba, Bytedance Halt Personalized AI Features as Regulations Tighten", "summary": "ByteDance and Alibaba are shutting down personalized AI companion features on their Doubao and Qwen platforms ahead of new Chinese rules on anthropomorphic AI that take effect July 15. The regulations, issued by China's Cyberspace Administration and other agencies, require anti-addiction safeguards and periodic break reminders that conflict with how persistent-memory AI companions are designed. Affected users have until mid-October to export their data before it is deleted.", "link": "https://www.theinformation.com/briefings/alibaba-bytedance-halt-personalized-ai-features-regulations-tighten", "category": "Technology & AI", "also_covered_by": [], "priority_pick": false},
  {"id": "2026-07-06-010", "date": "2026-07-06", "source": "The Information", "newsletter": "The Information AM", "title": "Singapore Files New Charges in Nvidia Chip Fraud Case", "summary": "Singapore prosecutors filed additional charges against four individuals and four companies accused of misrepresenting the end-users of servers containing restricted Nvidia AI chips. Authorities allege the hardware was routed through Singapore before being shipped onward to Malaysia or China in an effort to evade U.S. export controls. The case is one of several recent enforcement actions targeting alleged circumvention of chip export restrictions in Southeast Asia.", "link": null, "category": "Politics & Policy", "also_covered_by": [], "priority_pick": false},
  {"id": "2026-07-06-011", "date": "2026-07-06", "source": "The Logic", "newsletter": "The Logic", "title": "Quebec Ink: Quebec's era of endless, cheap electricity is coming to an end", "summary": "A Quebec Ink column by Martin Patriquin argues that the province's decades-long era of abundant, low-cost electricity is ending as demand rises from data centers, electrification, and industrial growth. Quebec has long relied on inexpensive hydroelectric power as an economic advantage for households and industry. The column suggests the province will need to rebalance supply commitments and pricing as demand pressures mount.", "link": null, "category": "Energy & Commodities", "also_covered_by": [], "priority_pick": false},
  {"id": "2026-07-05-001", "date": "2026-07-05", "source": "The Information", "newsletter": "The Information", "title": "OpenAI vs. Anthropic: AI's IPO Race Begins", "summary": "Anthropic has begun discussing a possible initial public offering as soon as the fourth quarter of 2026, shortly after raising funding at a valuation near $900 billion, while OpenAI is also moving toward a future listing. Reporting indicates OpenAI's CEO and CFO differ on how quickly to pursue an IPO, with the company projected to burn well over $100 billion in cash before turning a profit. The competing timelines could put Anthropic ahead of OpenAI in reaching public markets despite OpenAI's larger valuation and profile.", "link": "https://www.theinformation.com/articles/anthropic-vs-openai-race-ipo-first-necessarily-mean-best", "category": "Markets & Finance", "also_covered_by": ["Enterprise AI Executive"], "priority_pick": true},
  {"id": "2026-07-05-002", "date": "2026-07-05", "source": "The Information", "newsletter": "The Information", "title": "Kalshi Nears $2 Billion in Annualized Revenue Amid Informal IPO Talks", "summary": "Prediction-market operator Kalshi has surpassed $2 billion in annualized revenue, roughly three times its level in November, driven by a surge in betting volume tied to NBA and World Cup events. The company is reportedly holding informal discussions about a possible initial public offering. Kalshi's growth adds it to a widening list of companies, including OpenAI and SpaceX, weighing near-term public listings.", "link": "https://www.theinformation.com/articles/kalshi-passes-2-billion-annualized-revenue-early-ipo-talks", "category": "Markets & Finance", "also_covered_by": [], "priority_pick": false},
  {"id": "2026-07-05-003", "date": "2026-07-05", "source": "The Information", "newsletter": "The Information", "title": "Walmart's Amazon-Sized Ads Opportunity", "summary": "Walmart has built an advertising business large enough that it now generates more ad revenue than smaller social platforms such as Snap or Pinterest, according to The Information. The growth follows Walmart's roughly $1.4 billion acquisition of ad-tech startup Vibe, intended to help it sell more advertising to marketers on streaming platforms. The expansion positions Walmart's media business as an increasingly significant competitor to Amazon's advertising unit.", "link": "https://www.theinformation.com/articles/walmarts-amazon-sized-ads-opportunity", "category": "Business & Strategy", "also_covered_by": [], "priority_pick": false},
  {"id": "2026-07-05-004", "date": "2026-07-05", "source": "BCG", "newsletter": "Enterprise AI Executive", "title": "BCG's CXO Guide to AI Token Cost Control", "summary": "Boston Consulting Group published guidance urging enterprise leaders to treat AI token spending as a governed cost center rather than an open-ended expense, introducing a \"return on AI\" metric to weigh value against spend. The report argues that decisions about AI models, architecture, and control infrastructure should be evaluated together rather than optimized solely for the lowest per-token price. BCG contends that companies achieving the best financial outcomes from AI will be those maximizing returns, not simply those spending the least or the most.", "link": "https://www.bcg.com/publications/2026/managing-ai-token-costs", "category": "Technology & AI", "also_covered_by": [], "priority_pick": false},
  {"id": "2026-07-05-005", "date": "2026-07-05", "source": "Palantir", "newsletter": "Enterprise AI Executive", "title": "Palantir Publishes \"AI Sovereignty\" Manifesto, Criticizes Rivals' Token Pricing", "summary": "Palantir published a nine-point manifesto describing what it calls \"AI sovereignty,\" urging organizations to keep their data in-house, control their own model weights, and avoid token-based pricing for AI services. The manifesto criticizes what Palantir calls \"tokenmaxxing\" and implicitly challenges the business models of OpenAI and Anthropic. Palantir CEO Alex Karp separately called competitors' token-based pricing \"insane\" in a television interview shortly before the post.", "link": "https://thenextweb.com/news/palantir-ai-sovereignty-manifesto-tokenmaxxing", "category": "Technology & AI", "also_covered_by": [], "priority_pick": false},
  {"id": "2026-07-04-001", "date": "2026-07-04", "source": "Wall Street Journal", "newsletter": "WSJ Latest in Artificial Intelligence", "title": "The Quest to Make Humanoid Robots Safe Enough for Humans", "summary": "The Wall Street Journal examines the safety engineering challenges facing humanoid robot makers after several viral incidents of robots malfunctioning around people. Manufacturers report no serious injuries or deaths to date, but growing concern centers on the robots approaching 200 pounds in weight, raising the stakes if a bipedal machine loses power near a person. Companies are responding with layered safeguards, including emergency stop buttons and chip-level safety systems, such as a new Nvidia system built on its Blackwell chips that can interpret sensor data and halt a robot when conditions become unsafe.", "link": null, "category": "Technology & AI", "also_covered_by": [], "priority_pick": true},
  {"id": "2026-07-03-001", "date": "2026-07-03", "source": "Wall Street Journal", "newsletter": "WSJ Latest in Artificial Intelligence", "title": "AI Data Centers Use Far More Water Than Most Tech Giants Report", "summary": "AI data centers consume substantially more water than most tech companies publicly disclose, largely because indirect water use at the power plants supplying their electricity is typically excluded from corporate reporting; only Meta currently discloses this indirect figure. A 2024 Lawrence Berkeley National Laboratory analysis found indirect water consumption for U.S. data centers has historically run about 12 times greater than their direct on-site use. Separately, climate consulting firm Carbon Direct estimates $170 billion of planned AI data-center capacity has been blocked, stalled, or canceled since 2024.", "link": "https://www.wsj.com/tech/ai/ai-data-centers-water-use-901e2902", "category": "Technology & AI", "also_covered_by": [], "priority_pick": false},
  {"id": "2026-07-03-002", "date": "2026-07-03", "source": "The Information", "newsletter": "The Information AM", "title": "Microsoft Commits $2.5 Billion to New Applied AI Consulting Effort", "summary": "Microsoft commercial CEO Judson Althoff announced a new business unit, Microsoft Frontier Company, dedicated to helping large customers deploy and customize AI applications. The company is committing $2.5 billion and assigning 6,000 employees to the effort, which will be led by sales president Rodrigo Kede Lima. The move follows similar \"forward deployed engineer\" initiatives from Amazon, Google, Palantir, Meta, and OpenAI aimed at helping enterprise customers get better returns from AI spending.", "link": "https://www.theinformation.com/briefings/microsoft-commits-2-5-billion-new-applied-ai-consulting-effort", "category": "Technology & AI", "also_covered_by": ["The Briefing", "Mobile World Live"], "priority_pick": true},
  {"id": "2026-07-03-003", "date": "2026-07-03", "source": "The Information", "newsletter": "The Information AM", "title": "Google Loses Fight Against Record €4.1 Billion Android Antitrust Fine", "summary": "The European Court of Justice dismissed Google's final appeal against a €4.1 billion ($4.7 billion) fine over its Android operating system, ending an eight-year antitrust battle that began with a 2018 European Commission ruling. Regulators found Google had required phone makers to pre-install Google Search and Chrome to access the Play Store and tied ad revenue sharing to exclusivity against rival search engines. The case is one of three antitrust actions in which the EU has fined Google more than $9 billion combined since 2017.", "link": "https://www.theinformation.com/briefings/google-loses-fight-record-4-1-billion-android-antitrust-fine", "category": "Politics & Policy", "also_covered_by": ["The Briefing"], "priority_pick": false},
  {"id": "2026-07-03-004", "date": "2026-07-03", "source": "The Information", "newsletter": "The Information AM", "title": "Alibaba Bans Employees From Using Claude", "summary": "Alibaba Group has barred employees from using Anthropic's Claude Code and ordered the removal of Claude models from company computers, citing security concerns following a controversy over hidden code that could detect whether users were in China. The ban follows Anthropic's recent accusation that Alibaba illicitly used Claude models to train its own AI systems through distillation. Alibaba has separately sued the U.S. Department of Defense over its inclusion on a Pentagon blacklist of Chinese companies with alleged military ties.", "link": "https://www.theinformation.com/briefings/alibaba-bans-employees-using-claude", "category": "Technology & AI", "also_covered_by": [], "priority_pick": false},
  {"id": "2026-07-03-005", "date": "2026-07-03", "source": "The Information", "newsletter": "The Information AM", "title": "SoftBank Plans to Rent AI Computing Capacity to U.S. Companies", "summary": "SoftBank Group and its telecom unit SoftBank Corp announced plans to rent AI computing capacity to U.S. companies starting in April, through a new neocloud venture called SB Neo Inc. The venture aims to scale to 10 gigawatts of capacity to meet AI data center demand, putting SoftBank in direct competition with cloud providers such as CoreWeave and Nebius Group. SoftBank is borrowing heavily to invest across the AI supply chain, including chips, servers, data centers, and power.", "link": "https://www.theinformation.com/briefings/softbank-plans-rent-ai-computing-capacity-u-s-companies", "category": "Technology & AI", "also_covered_by": [], "priority_pick": false},
  {"id": "2026-07-03-006", "date": "2026-07-03", "source": "The Information", "newsletter": "The Information AM", "title": "Kuaishou Announces Kling AI Video Unit's Fundraising at $15 Billion Valuation", "summary": "Kuaishou Technology said its Kling AI video unit has agreed to raise nearly $3 billion at a $15 billion pre-money valuation, with Kuaishou retaining a 68.33% stake after the round closes. The funding, led by Chinese investment firms CPE and Guofang Investment along with Tencent and Abu Dhabi-based BlueFive, values Kling below the $20 billion target Kuaishou had sought earlier this year. Kling's first-quarter revenue reportedly surged 300% year-over-year to an annualized run rate of about $500 million in March.", "link": "https://www.theinformation.com/briefings/kuaishou-announces-kling-ai-video-units-fundraising-15-billion-valuation", "category": "Technology & AI", "also_covered_by": [], "priority_pick": false},
  {"id": "2026-07-03-007", "date": "2026-07-03", "source": "The Information", "newsletter": "The Information AM", "title": "Nvidia's Longtime Sales Chief Retires", "summary": "Jay Puri, Nvidia's top sales executive and a direct report to CEO Jensen Huang, stepped down from his day-to-day role after 21 years at the company; Microsoft sales executive Nicholas Parker was named as his successor, starting August 24. Puri, 71, is expected to remain as a senior adviser and is credited with helping transition Nvidia from a consumer gaming brand into an enterprise AI chip supplier.", "link": "https://www.theinformation.com/briefings/nvidias-longtime-sales-chief-retires", "category": "Business & Strategy", "also_covered_by": ["The Briefing"], "priority_pick": false},
  {"id": "2026-07-03-008", "date": "2026-07-03", "source": "The Information", "newsletter": "The Information AM", "title": "OpenAI Has Discussed Size of Stake U.S. Government Could Take", "summary": "OpenAI has held preliminary discussions with the U.S. government about the size of an equity stake it might take in the company, with the Financial Times earlier reporting a proposed 5% stake from OpenAI's CEO. The proposal follows an OpenAI white paper floating a public wealth fund seeded by AI company assets, an idea similar to a bill from Senator Bernie Sanders proposing a 50% government stake in top AI firms. Anthropic has made a similar public fund proposal but has not discussed a government stake directly with the administration.", "link": "https://www.theinformation.com/briefings/openai-discussed-size-stake-u-s-government-take", "category": "Politics & Policy", "also_covered_by": ["The Briefing"], "priority_pick": false},
  {"id": "2026-07-03-009", "date": "2026-07-03", "source": "The Information", "newsletter": "The Information AM", "title": "Tesla Vehicle Sales Rebounded 25% in Second Quarter", "summary": "Tesla's global vehicle deliveries rose 25% year-over-year to 480,000 in the second quarter, with 468,000 of those being Model 3 or Model Y vehicles, following a sales slump in 2025. The company's energy storage business deployed 13.5 gigawatt-hours of batteries in the quarter, up 41% year-over-year, while Tesla shares fell 7% on the day of the announcement. Rising European gas prices tied to the Iran war have been credited with boosting electric vehicle demand broadly, including for Tesla and Chinese rivals such as BYD.", "link": "https://www.theinformation.com/briefings/tesla-vehicle-sales-rebounded-25-second-quarter", "category": "Markets & Finance", "also_covered_by": ["The Briefing"], "priority_pick": false},
  {"id": "2026-07-03-013", "date": "2026-07-03", "source": "The Globe and Mail", "newsletter": "The Globe and Mail Business Brief", "title": "Ottawa's Elusive AI Startup", "summary": "Turbopuffer, a three-year-old Ottawa startup with a small team, has become an infrastructure provider for major AI companies including Anthropic and is on pace to generate roughly $100 million in revenue. Co-founders Simon Eskildsen, a former Shopify engineer, and Justine Li built a lower-cost method for AI systems to search stored data, and have deliberately avoided marketing and media attention despite the company's rapid growth.", "link": "https://www.theglobeandmail.com/business/article-business-brief-ottawas-elusive-ai-startup/", "category": "Canadian Business", "also_covered_by": [], "priority_pick": false},
  {"id": "2026-07-03-014", "date": "2026-07-03", "source": "Mobile World Live", "newsletter": "Mobile World Live", "title": "HCLTech Inks $1.1 Billion AI Deal With European Firm", "summary": "Indian IT services company HCLTech secured a $1.1 billion contract with a major European company to deploy AI services and help manage its enterprise technology offerings. The deal adds to a wave of large AI services contracts among global IT consultancies as enterprises look for help implementing AI at scale.", "link": null, "category": "Business & Strategy", "also_covered_by": [], "priority_pick": false},
  {"id": "2026-07-03-015", "date": "2026-07-03", "source": "Mobile World Live", "newsletter": "Mobile World Live", "title": "Meta CEO Downbeat on AI Gains So Far", "summary": "Meta CEO Mark Zuckerberg reportedly told employees that the company's AI agent strategy is progressing more slowly than expected and that its AI-driven reorganization earlier this year has yet to deliver anticipated gains. The comments add to a broader pattern of large enterprises, including Uber and Starbucks, expressing frustration over difficulty generating measurable returns from AI investment.", "link": null, "category": "Technology & AI", "also_covered_by": [], "priority_pick": false},
  {"id": "2026-07-03-016", "date": "2026-07-03", "source": "Mobile World Live", "newsletter": "Mobile World Live", "title": "Amazon Leo Launches 29 More Satellites Ahead of Broadband Debut", "summary": "Amazon is on track to launch its Leo broadband service later this year after a United Launch Alliance rocket successfully deployed 29 more satellites, bringing the constellation's total to 396. The launch keeps Amazon on pace to compete with SpaceX's Starlink in the satellite broadband market.", "link": null, "category": "Technology & AI", "also_covered_by": [], "priority_pick": false},
  {"id": "2026-07-03-017", "date": "2026-07-03", "source": "Mobile World Live", "newsletter": "Mobile World Live", "title": "Anthropic in Talks With Samsung to Manufacture Custom AI Chip", "summary": "Anthropic is reportedly in early-stage discussions with Samsung Electronics about serving as a manufacturing partner for a custom AI chip, according to people familiar with the matter. No agreement has been finalized, and the talks remain preliminary. A custom chip effort would align Anthropic with rivals such as OpenAI and Google, which have pursued their own dedicated silicon.", "link": null, "category": "Technology & AI", "also_covered_by": ["Dealmaker"], "priority_pick": false},
  {"id": "2026-07-03-018", "date": "2026-07-03", "source": "Mobile World Live", "newsletter": "Mobile World Live", "title": "Apple to Debut Five New iPhones by 2027", "summary": "Apple reportedly plans to launch at least five new iPhone models between the second half of 2026 and the first half of 2027, while also ramping up production of foldable devices. The expanded lineup suggests an acceleration in Apple's product cadence and a deeper push into new device categories.", "link": null, "category": "Technology & AI", "also_covered_by": [], "priority_pick": false},
  {"id": "2026-07-02-002", "date": "2026-07-02", "source": "Wall Street Journal", "newsletter": "WSJ Latest in Artificial Intelligence", "title": "The Anthropic Fable Ban Is Over. The Battle Over How to Tame AI Has Just Begun.", "summary": "Washington has lifted its block on Anthropic's Fable AI model, but the reversal has intensified debate over how the U.S. should regulate increasingly capable AI systems. WSJ reporting notes that reasoning models and AI agents are evolving faster than regulators can track, making AI a much harder target to govern than industries like autos or air travel. A new Trump administration security-approval process now effectively determines when a frontier model is considered safe enough for release.", "link": "https://www.wsj.com/tech/ai/the-anthropic-fable-ban-is-over-the-battle-over-how-to-tame-ai-has-just-begun-e93f51d6", "category": "Politics & Policy", "also_covered_by": ["WSJ Morning Download"], "priority_pick": true},
  {"id": "2026-07-02-003", "date": "2026-07-02", "source": "Wall Street Journal", "newsletter": "WSJ Latest in Artificial Intelligence", "title": "Read the Emails Revealing How Anthropic's Pentagon Relationship Fell Apart", "summary": "Internal emails reviewed by the Wall Street Journal show Pentagon undersecretary Emil Michael and Anthropic CEO Dario Amodei exchanged messages for months over AI safety guardrails before the relationship deteriorated. The correspondence illustrates growing friction between Anthropic and the Defense Department over how the company's models can be used in national-security contexts.", "link": "https://www.wsj.com/politics/national-security/read-the-emails-revealing-how-anthropics-pentagon-relationship-fell-apart-b1d123dd", "category": "Politics & Policy", "also_covered_by": [], "priority_pick": false},
  {"id": "2026-07-02-004", "date": "2026-07-02", "source": "Wall Street Journal", "newsletter": "WSJ Morning Download", "title": "U.S. Adds 57,000 Jobs in June, Missing Forecasts as Unemployment Rate Falls to 4.2%", "summary": "The U.S. economy added 57,000 jobs in June, falling short of economists' expectations, the Labor Department reported. The unemployment rate nonetheless ticked down to 4.2%, better than the 4.3% rate economists had forecast.", "link": "https://www.wsj.com/economy/consumers/june-jobs-report-unemployment-6c9540b6", "category": "Global Economy", "also_covered_by": [], "priority_pick": false},
  {"id": "2026-07-02-005", "date": "2026-07-02", "source": "The Information", "newsletter": "The Information", "title": "Tesla Caps Employee AI Spend at $200 per Week After Adoption Push", "summary": "Tesla has capped how much individual employees can spend on AI tools at $200 per week, following a companywide push to expand AI adoption among staff. The cap reflects growing corporate scrutiny of AI tool costs as usage scales across large workforces.", "link": "https://www.theinformation.com/articles/tesla-caps-employee-ai-spend-200-per-week-adoption-push", "category": "Technology & AI", "also_covered_by": [], "priority_pick": false},
  {"id": "2026-07-02-006", "date": "2026-07-02", "source": "The Information", "newsletter": "Applied AI", "title": "Palantir CEO: Some U.S. Government Customers Switched to Open Source AI", "summary": "Palantir CEO Alex Karp said some U.S. government customers have shifted toward open-source AI models rather than working directly with OpenAI or Anthropic. Following a combative CNBC appearance in which he accused the two AI labs of overcharging customers and misusing their data, Karp positioned Palantir as a trusted intermediary between government agencies and AI vendors.", "link": null, "category": "Business & Strategy", "also_covered_by": [], "priority_pick": false},
  {"id": "2026-07-02-007", "date": "2026-07-02", "source": "The Information", "newsletter": "The Information", "title": "Microsoft Memo Details AI App Overhaul to 'Earn the Right to Exist'", "summary": "An internal Microsoft memo reportedly says the company plans to consolidate and overhaul its various Copilot chatbot products, with executives telling teams their AI apps must 'earn the right to exist.' The memo points to a broader push at Microsoft to sharpen its consumer and enterprise AI product strategy amid intensifying competition.", "link": "https://www.theinformation.com/articles/microsoft-memo-details-ai-app-overhaul-earn-right-exist", "category": "Technology & AI", "also_covered_by": [], "priority_pick": false},
  {"id": "2026-07-02-008", "date": "2026-07-02", "source": "The Information", "newsletter": "The Information", "title": "AI Data Centers Are Becoming Wall Street's Next Trade", "summary": "The Information reports that AI data centers have shifted from being primarily a technology infrastructure story to a financial one, as investors increasingly treat the compute capacity, power contracts and financing structures behind frontier AI models as tradeable assets. The shift reflects the scale of capital now required to build and finance the infrastructure that AI model developers depend on.", "link": null, "category": "Markets & Finance", "also_covered_by": [], "priority_pick": false},
  {"id": "2026-07-02-009", "date": "2026-07-02", "source": "The Information", "newsletter": "The Information", "title": "Anthropic in Talks With Samsung to Manufacture Custom AI Chip", "summary": "Anthropic has begun early-stage work on designing its own AI chip and has held talks with Samsung about manufacturing it, The Information reports. The move would follow other AI labs' efforts to reduce dependence on Nvidia by developing custom silicon for training and running their models.", "link": "https://www.theinformation.com/articles/anthropic-talks-samsung-manufacture-custom-ai-chip", "category": "Technology & AI", "also_covered_by": [], "priority_pick": false},
  {"id": "2026-07-02-010", "date": "2026-07-02", "source": "The Information", "newsletter": "The Information", "title": "Why Microsoft's Real Value Is Close to $3.8 Trillion, or $500 a Share", "summary": "The Information estimates Microsoft's sum-of-the-parts value is closer to $3.8 trillion, or roughly $500 per share, when its major businesses are valued individually rather than as a single combined entity. The analysis suggests certain segments of Microsoft's business may be undervalued relative to comparable standalone companies.", "link": "https://www.theinformation.com/articles/microsofts-real-value-close-3-8-trillion-500-share", "category": "Markets & Finance", "also_covered_by": [], "priority_pick": false},
  {"id": "2026-07-02-011", "date": "2026-07-02", "source": "The Information", "newsletter": "The Information AM", "title": "Nvidia Will Backstop Customers' GPUs, Take a Cut of Their Cloud Revenues", "summary": "Nvidia is using its balance sheet to help more companies afford its expensive AI chips, agreeing to financially backstop young cloud providers that rent out its GPUs in exchange for a cut of those providers' cloud revenue. The arrangement is designed to support demand for Nvidia's chips while creating a new recurring revenue stream tied to how customers actually use them.", "link": null, "category": "Technology & AI", "also_covered_by": [], "priority_pick": false},
  {"id": "2026-07-02-012", "date": "2026-07-02", "source": "The Logic", "newsletter": "The Logic", "title": "Zero Point Cryogenics Wants to Freeze the Quantum World", "summary": "Edmonton-based Zero Point Cryogenics is building near-absolute-zero cryogenic freezers needed to operate quantum computers, positioning the company as a supplier to the growing quantum computing industry. The report highlights a small but expanding cluster of Canadian quantum hardware firms serving global quantum computing developers.", "link": "https://thelogic.co/news/zero-point-edmonton-quantum/", "category": "Canadian Business", "also_covered_by": [], "priority_pick": false},
  {"id": "2026-07-03-010", "date": "2026-07-02", "source": "The Information", "newsletter": "The Briefing", "title": "Nvidia to Financially Backstop Younger Neocloud Firms Amid Funding Boom", "summary": "Nvidia is offering to financially backstop smaller \"neocloud\" firms that rent out AI servers, in exchange for a share of their revenues, as competition intensifies among the growing number of companies entering the sector. The move comes as SoftBank launched a new U.S. neocloud venture and AI infrastructure startup Together AI raised $800 million, underscoring plentiful funding despite concerns about overbuilding. Analysts note Nvidia's backstopping could increase financial risk for smaller, less-established players relative to larger cloud providers like AWS, Google Cloud, and Microsoft Azure.", "link": null, "category": "Technology & AI", "also_covered_by": [], "priority_pick": false},
  {"id": "2026-07-03-011", "date": "2026-07-02", "source": "The Information", "newsletter": "Dealmaker", "title": "Freshfields Wins Role in Anthropic's IPO", "summary": "British law firm Freshfields has been retained by Anthropic's bankers to work on the company's initial public offering, which is expected to raise tens of billions of dollars at a valuation exceeding $1 trillion. Freshfields, founded in 1743, opened its first Silicon Valley office in 2020 and has previously advised on deals including Google's $32 billion acquisition of Wiz and the European portion of SpaceX's $86 billion share offering. Rival law firms Cooley, Wachtell Lipton, and Latham & Watkins are advising OpenAI on its own competing IPO process.", "link": null, "category": "Professional Services", "also_covered_by": [], "priority_pick": false},
  {"id": "2026-07-03-012", "date": "2026-07-02", "source": "The Information", "newsletter": "Dealmaker", "title": "Lime Goes Public at $1.6 Billion Valuation", "summary": "Scooter and bike rental company Lime went public on the Nasdaq this week at a $1.6 billion valuation, generating returns for early investors including Andreessen Horowitz, which held a 5% stake at the time of listing. Lime's prospectus had warned the company faced possible bankruptcy without a public listing. CEO Wayne Ting framed the IPO as a bet on an \"AI-resilient\" physical-world business, comparable in positioning to companies like Oura, Reformation, and Jersey Mike's.", "link": null, "category": "Markets & Finance", "also_covered_by": [], "priority_pick": false},
  {"id": "2026-07-01-001", "date": "2026-07-01", "source": "Wall Street Journal", "newsletter": "WSJ Morning Download", "title": "Anthropic Nears Deal With Trump Administration to Restore Access to Fable AI Model", "summary": "Anthropic reached a deal with the Trump administration to restore public access to its Fable AI model after roughly two and a half weeks of restricted access tied to cybersecurity concerns. The episode has renewed debate over how the U.S. government balances export and access controls on frontier AI models against industry and national-security interests.", "link": "https://www.wsj.com/tech/ai/anthropic-nears-deal-with-trump-administration-to-restore-access-to-fable-ai-model-6f4177f3", "category": "Politics & Policy", "also_covered_by": ["WSJ Latest in Artificial Intelligence", "WSJ Pro Cybersecurity", "Mobile World Live"], "priority_pick": true},
  {"id": "2026-07-01-002", "date": "2026-07-01", "source": "Wall Street Journal", "newsletter": "WSJ Latest in Artificial Intelligence", "title": "SpaceX Showed Investors Prototype of Elon Musk's New AI Device", "summary": "SpaceX presented investors with a prototype of a sleek, handset-like AI device designed to integrate technology from xAI, Elon Musk's artificial intelligence company. The demonstration signals SpaceX's growing involvement in consumer AI hardware alongside its core space and satellite businesses.", "link": "https://www.wsj.com/tech/ai/spacex-showed-investors-prototype-of-elon-musks-new-ai-device-b445c57b", "category": "Technology & AI", "also_covered_by": [], "priority_pick": false},
  {"id": "2026-07-01-003", "date": "2026-07-01", "source": "Wall Street Journal", "newsletter": "WSJ Latest in Artificial Intelligence", "title": "The World's Top Economists Are Sounding the Alarm on AI", "summary": "A growing number of prominent economists have joined warnings about the potential global economic fallout if the current AI investment boom turns into a bust. Their concerns center on how concentrated AI-related capital spending and valuations have become across the economy.", "link": "https://www.wsj.com/tech/ai/the-worlds-top-economists-are-sounding-the-alarm-on-ai-d99055b6", "category": "Global Economy", "also_covered_by": [], "priority_pick": false},
  {"id": "2026-07-01-004", "date": "2026-07-01", "source": "Wall Street Journal", "newsletter": "WSJ Pro Cybersecurity", "title": "Cyber Insurers Want to See Policyholders Take AI Seriously", "summary": "Cyber insurers are increasingly requiring policyholders to demonstrate concrete safeguards against AI-related security risks before offering or renewing coverage. Insurers are scrutinizing exposure to compromised AI tools, patching speed, and vendor vetting as AI-driven threats become a material underwriting factor.", "link": "https://www.wsj.com/pro/cybersecurity/cyber-insurers-focus-on-speed-as-ai-rewrites-security-0983ad61", "category": "Technology & AI", "also_covered_by": [], "priority_pick": false},
  {"id": "2026-07-01-005", "date": "2026-07-01", "source": "Light Reading", "newsletter": "SmartBrief on Connectivity", "title": "House Lawmakers Grill NTIA Chief Over BEAD Broadband Deployment Delays", "summary": "At a June 30 House Energy and Commerce subcommittee hearing, NTIA Administrator Arielle Roth faced bipartisan criticism over the slow rollout of the $42.5 billion Broadband Equity, Access and Deployment (BEAD) program, with lawmakers noting only Nebraska and Louisiana have connected any locations so far. Legislators also raised concerns about delayed non-deployment fund guidance and provider dropouts, including Resound Networks declining more than $100 million in BEAD awards.", "link": "https://www.lightreading.com/broadband/house-bead-hearing-highlights-hurdles-and-hypocrisies", "category": "Politics & Policy", "also_covered_by": [], "priority_pick": false},
  {"id": "2026-07-01-006", "date": "2026-07-01", "source": "Fierce Network", "newsletter": "SmartBrief on Connectivity", "title": "Verizon and BT Form $4 Billion Joint Venture for Global Enterprise Customers", "summary": "Verizon and BT Group agreed to merge their international enterprise operations into a 50:50 joint venture worth roughly $4 billion in combined annual revenue, serving more than 3,000 multinational customers across over 180 countries. Verizon will make a $625 million equalization payment to BT as part of the deal, which still requires regulatory approval.", "link": "https://www.fierce-network.com/broadband/verizon-bt-merge-international-enterprise-operations-5050-jv-worth-4b", "category": "Business & Strategy", "also_covered_by": [], "priority_pick": false},
  {"id": "2026-07-01-007", "date": "2026-07-01", "source": "SpaceNews", "newsletter": "SmartBrief on Connectivity", "title": "EchoStar's Dish DBS and Wireless Units File for Chapter 11 Bankruptcy", "summary": "EchoStar's Dish DBS satellite-TV subsidiary and certain wireless units filed for prepackaged Chapter 11 bankruptcy on June 30 after being unable to repay $2 billion in senior secured notes due July 1, a shortfall linked to delays in closing a previously announced $23 billion spectrum sale to AT&T. The filing is also intended to facilitate the wind-down of the legacy Dish Wireless 5G network, backed by a $2.4 billion FCC escrow fund and supported by holders of more than 88% of Dish's debt.", "link": null, "category": "Business & Strategy", "also_covered_by": [], "priority_pick": false},
  {"id": "2026-07-01-008", "date": "2026-07-01", "source": "MIT", "newsletter": "Enterprise AI Executive", "title": "MIT-Microsoft Study Ranks 101 Enterprise Tasks by Agent Confidence", "summary": "A study by MIT in partnership with Microsoft surveyed 300 global technology experts to rank 101 enterprise tasks across AI, data, and cloud workflows by how confident they are in AI agents completing them independently. Confidence was highest for generating reports and boilerplate code but dropped sharply for complex, multi-step reasoning tasks, with 59% of respondents saying human oversight remains critical for higher-stakes work.", "link": "https://wp.technologyreview.com/wp-content/uploads/2026/06/MITTRI_Microsoft_Report_June26.pdf", "category": "Technology & AI", "also_covered_by": [], "priority_pick": false},
  {"id": "2026-07-01-009", "date": "2026-07-01", "source": "Goldman Sachs", "newsletter": "Enterprise AI Executive", "title": "Goldman Sachs: AI Driving an Industrial \"Supercycle\" Across the Real Economy", "summary": "Goldman Sachs published a report arguing that AI is accelerating industrial transformation across both digital and physical sectors faster, more broadly, and more capital-intensively than prior technology cycles. The bank frames this as an investment supercycle spanning infrastructure, energy, and industrial applications of AI.", "link": "https://www.goldmansachs.com/what-we-do/investment-banking/insights/articles/harnessing-ai-for-the-real-economy/goldman-sachs-harnessing-ai-for-the-real-economy.pdf", "category": "Technology & AI", "also_covered_by": [], "priority_pick": false},
  {"id": "2026-07-01-010", "date": "2026-07-01", "source": "Deloitte", "newsletter": "Enterprise AI Executive", "title": "Deloitte: Most Enterprises Say Their AI Operating Model Must Change Within 18 Months", "summary": "Deloitte surveyed more than 660 technology executives worldwide and found 81% believe they can already deploy and govern AI at scale, yet nearly 75% expect their operating model will need to change within 12 to 18 months to sustain progress. The findings suggest governance structures, not the underlying technology, are the near-term bottleneck for enterprise AI adoption.", "link": "https://www.deloitte.com/us/en/insights/topics/technology-management/rewiring-ai-operating-model.html", "category": "Business & Strategy", "also_covered_by": [], "priority_pick": false},
  {"id": "2026-07-01-011", "date": "2026-07-01", "source": "Mobile World Live", "newsletter": "Mobile World Live", "title": "Zain Wins 25-Year Syria Telecoms Licence for $750M", "summary": "Zain Group secured a 25-year telecommunications licence in Syria worth $750 million following a competitive tender process. The award is intended to support modernization of the country's existing telecom infrastructure.", "link": null, "category": "Business & Strategy", "also_covered_by": [], "priority_pick": false},
  {"id": "2026-07-01-012", "date": "2026-07-01", "source": "Mobile World Live", "newsletter": "Mobile World Live", "title": "UK's CMA Fast-Tracks In-Depth Probe into £2B Fibre Deal", "summary": "The UK Competition and Markets Authority launched an in-depth investigation into Nexfibre's proposed £2 billion takeover of rival broadband provider Netomnia. The probe introduces regulatory uncertainty for further consolidation in the UK fibre broadband market.", "link": null, "category": "Markets & Finance", "also_covered_by": [], "priority_pick": false},
  {"id": "2026-07-01-014", "date": "2026-07-01", "source": "The Information", "newsletter": "The Information", "title": "OpenAI Selects Law Firms Cooley, Wachtell to Prepare for IPO as Anthropic Files Confidentially", "summary": "OpenAI and Anthropic's rivalry is reportedly extending into a race toward public markets: Anthropic has made a confidential IPO filing, while OpenAI has retained law firms Cooley and Wachtell to help prepare for its own potential listing. Other reporting from The Information indicates some investors remain skeptical of both companies' IPO prospects, and that OpenAI and Anthropic employees have already cashed out roughly $14 billion combined through secondary share sales.", "link": "https://www.theinformation.com/articles/openai-selects-law-firms-cooley-wachtell-ipo-prep", "category": "Markets & Finance", "also_covered_by": [], "priority_pick": false},
  {"id": "2026-07-01-015", "date": "2026-07-01", "source": "The Information", "newsletter": "The Information AM", "title": "Nvidia Funds Security Firm Verkada at $5.8 Billion Valuation", "summary": "Nvidia is investing an unspecified amount in Verkada, a maker of security cameras and related software, at a $5.8 billion valuation matching the company's December financing round led by Alphabet's CapitalG. With technical assistance from Nvidia engineers, Verkada said the precision of its video AI has improved.", "link": "https://www.theinformation.com/briefings/exclusive-nvidia-funds-security-firm-verkada", "category": "Technology & AI", "also_covered_by": [], "priority_pick": false},
  {"id": "2026-07-02-001", "date": "2026-07-01", "source": "The Information", "newsletter": "The Information Briefing", "title": "Bending Spoons Stock Jumps 40% in Trading Debut", "summary": "Bending Spoons, the Italian company known for acquiring and overhauling struggling digital brands such as AOL, Evernote and Vimeo, saw its shares jump 40% on their first day of trading as a public company. That compared with a more modest 4% first-day gain for scooter rental firm Lime, which also debuted the same week following SpaceX's high-profile public offering.", "link": null, "category": "Markets & Finance", "also_covered_by": [], "priority_pick": false},
  {"id": "2026-06-30-001", "date": "2026-06-30", "source": "Wall Street Journal", "newsletter": "WSJ Morning Download", "title": "Companies Race to Limit AI Token Costs", "summary": "As AI agents proliferate in enterprise workflows, companies are facing runaway token consumption costs that have caught many off guard. Uber burned through its entire 2026 AI coding budget by April after deployment jumped to 84% of its 5,000-engineer organization, with monthly per-engineer API costs ranging from $500 to $2,000; Goldman Sachs projects AI agents will increase token consumption 24-fold over the next four years. Enterprises including Amazon, Uber, Meta, Walmart, and Cisco are now implementing token rationing and cost-tracking systems analogous to cloud bill management from the previous era.", "link": null, "category": "Technology & AI", "also_covered_by": ["WSJ Artificial Intelligence Alert"], "priority_pick": false},
  {"id": "2026-06-30-002", "date": "2026-06-30", "source": "Wall Street Journal", "newsletter": "WSJ Heard on the Street", "title": "Comcast's Breakup Is Overdue. It Shouldn't Rush Into a New Marriage.", "summary": "Comcast announced on June 29, 2026, a tax-free spinoff of NBCUniversal and Sky into a separate publicly traded company, ending a 15-year experiment in bundling cable distribution with media content. The breakup, which will split 65 million subscribers and redivide over $90 billion in debt across two firms, marks the structural endpoint of vertical integration in the streaming era; co-CEO Mike Cavanagh will lead the newly independent NBCUniversal. WSJ's Heard on the Street column argues the breakup is long overdue but that Comcast should not rush into new acquisitions, as tax rules will constrain further deals for at least two years after the split.", "link": null, "category": "Business & Strategy", "also_covered_by": ["WSJ CMO Today", "Mobile World Live Daily Edition"], "priority_pick": true},
  {"id": "2026-06-30-003", "date": "2026-06-30", "source": "Wall Street Journal", "newsletter": "WSJ CMO Today", "title": "Madison Avenue Is All In on AI", "summary": "Major advertising holding companies have moved from AI experimentation to full deployment, with brands rapidly adopting AI tools to cut production costs and automate ad buying, according to WSJ's CMO Today. WPP CEO Mark Read announced his departure at year end while emphasizing AI's centrality to the firm's future; Omnicom and IPG are pursuing a $13 billion merger aimed at building a combined firm better equipped to compete in an AI-driven market. The shift signals what industry observers describe as a transition from an attention economy to an intelligence economy, where algorithmic decision-making displaces human media planning.", "link": null, "category": "Business & Strategy", "also_covered_by": [], "priority_pick": false},
  {"id": "2026-06-30-004", "date": "2026-06-30", "source": "Wall Street Journal", "newsletter": "Wall Street Journal", "title": "BIS Warns AI Investment Boom Poses Systemic Risk to Global Financial Stability", "summary": "The Bank for International Settlements' annual economic report, released June 28, 2026, identified the AI investment boom as a potential systemic threat, noting that the five largest hyperscalers are on track to spend more than $1 trillion on AI-related capital expenditure across 2025 and 2026 — a pace exceeding their earnings and free cash flow that is forcing some to borrow heavily. The BIS flagged opaque 'circular financing' arrangements in which hyperscalers take equity stakes in AI labs that then commit to multi-year compute purchases from those same hyperscalers, with risks that the same assets are pledged multiple times. A major repricing of AI-related stocks, the report warns, could produce sharper wealth effects and a more pronounced consumption pullback than past market corrections.", "link": null, "category": "Markets & Finance", "also_covered_by": [], "priority_pick": false},
  {"id": "2026-06-30-005", "date": "2026-06-30", "source": "The Information", "newsletter": "Applied AI", "title": "Anthropic Preps Claude Agent in Microsoft Teams", "summary": "Anthropic is preparing to deploy Claude as an embedded agent inside Microsoft Teams, building on the Slack-first launch of Claude Tag on June 23, 2026, according to The Information. Despite potential competitive concerns, both Salesforce and Microsoft are taking a conciliatory approach to Anthropic, whose AI capabilities threaten their core enterprise apps. The broader Microsoft-Anthropic partnership also includes Copilot Cowork for Microsoft 365, enabling Claude to perform tasks like building presentations, pulling data into Excel, and scheduling meetings on behalf of enterprise users.", "link": "https://www.theinformation.com/newsletters/applied-ai/anthropic-preps-claude-agent-microsoft-teams", "category": "Technology & AI", "also_covered_by": [], "priority_pick": false},
  {"id": "2026-06-30-006", "date": "2026-06-30", "source": "The Information", "newsletter": "The Information", "title": "KKR, Nvidia and Kuwait Investment Authority Launch $10B Helix Digital Infrastructure", "summary": "KKR, Nvidia, and the Kuwait Investment Authority jointly launched Helix Digital Infrastructure, an AI infrastructure company backed by more than $10 billion, to develop and operate data centers targeting enterprise AI demand. Former AWS CEO Adam Selipsky, now a KKR senior adviser, will serve as CEO of Helix, which will partner with cloud providers to design, own, and run its own data centers and power infrastructure. The venture addresses a critical bottleneck in AI buildout: only one-third of the roughly 12 gigawatts of data-center capacity planned for 2026 is currently under active construction, while more than $130 billion in new projects faced community opposition in the first quarter of 2026 alone.", "link": "https://www.theinformation.com/articles/new-kkr-venture-hunts-deals-clear-data-center-logjam", "category": "Business & Strategy", "also_covered_by": [], "priority_pick": false},
  {"id": "2026-06-30-007", "date": "2026-06-30", "source": "The Information", "newsletter": "The Information", "title": "AI Video Startup Higgsfield in Talks to Raise at $5 Billion Valuation", "summary": "AI video generation startup Higgsfield is in talks to raise $300 million to $500 million at a pre-money valuation of $5 billion, according to The Information — nearly a four-fold increase from its January 2026 Series A extension at a $1.3 billion valuation led by Accel. The company, founded by Alex Mashrabov, former head of generative AI at Snap, reported approximately $400 million in annualized revenue as of May 2026 and is targeting $1 billion in annualized run-rate by year end. The talks are still ongoing, with no lead investor or deal structure publicly confirmed.", "link": "https://www.theinformation.com/articles/ai-video-startup-talks-quadruple-valuation-5-billion", "category": "Technology & AI", "also_covered_by": [], "priority_pick": false},
  {"id": "2026-06-30-008", "date": "2026-06-30", "source": "Mobile World Live", "newsletter": "Mobile World Live Daily Edition", "title": "Skylo CEO on Direct-to-Device Satellite, EU Sovereignty, and the SpaceX IPO", "summary": "Skylo CEO Parth Trivedi outlined the company's standards-based approach to direct-to-device satellite connectivity in a Mobile World Live podcast, arguing that carrier-grade, interoperable NTN protocols — rather than proprietary networks — provide the durable competitive edge in a market now reshaped by SpaceX's record $75 billion IPO in June 2026. Skylo recently partnered with UAE-based Space42 to extend D2D service across more than 37 countries via the Thuraya-4 satellite footprint, using the same SIM and identity framework for seamless device access. The conversation also covered EU data sovereignty concerns as European operators assess the risk of relying on US-controlled satellite networks for critical connectivity.", "link": null, "category": "Technology & AI", "also_covered_by": [], "priority_pick": false},
  {"id": "2026-06-30-009", "date": "2026-06-30", "source": "The Logic", "newsletter": "The Logic", "title": "A Niche White-Collar Role Is Becoming the AI Industry's Hot New Job", "summary": "Tech companies are hiring specialists who bridge engineering and domain expertise to evaluate and train AI model outputs — a role that is rapidly gaining traction across law, medicine, and finance, according to The Logic. Platforms like Mercor, valued at $10 billion, have built contractor networks of 30,000 doctors, lawyers, and writers collectively earning over $1.5 million per day, with global demand for AI evaluators growing at 25–35% annually. Senior roles in the field carry salaries of $170,000–$220,000, while the broader category is drawing professionals previously priced out of traditional software engineering careers.", "link": null, "category": "Professional Services", "also_covered_by": [], "priority_pick": false},
  {"id": "2026-07-01-013", "date": "2026-06-30", "source": "The Information", "newsletter": "The Information Briefing", "title": "Circle's New Rival", "summary": "Stripe, Visa, Mastercard, Coinbase, BlackRock, and BNY are leading a consortium of more than 140 firms to launch a new stablecoin called Open USD later this year, aiming to challenge Circle and Tether's dominance of the roughly $300 billion stablecoin market. The venture plans to share reserve income with distribution partners and forgo conversion fees; Circle shares fell 18% on the news, though past multi-partner stablecoin efforts such as Facebook's Libra and Paxos's USDG have struggled to gain scale.", "link": null, "category": "Markets & Finance", "also_covered_by": [], "priority_pick": false},
