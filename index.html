  {"id": "2026-05-11-039", "date": "2026-05-11", "source": "The Rundown AI", "newsletter": "The Rundown AI", "title": "AI System RAVEN Discovers 100+ New Exoplanets from NASA TESS Data", "summary": "Researchers at the University of Warwick developed RAVEN, an AI system that identified more than 100 previously undetected exoplanet candidates in NASA TESS mission data that had been processed and set aside. The system uses a neural architecture trained to recognize transit signals buried in noise that human analysts and earlier automated pipelines had missed. The findings were published and represent one of the largest single-batch exoplanet discoveries from re-analysis of an existing dataset, suggesting that AI review of archived astronomical data may be as productive as collecting new observations.", "link": "https://warwick.ac.uk/news/pressreleases/ai-approach-uncovers-dozens-of-hidden-planets/", "category": "Science & Health", "also_covered_by": [], "priority_pick": false},
  {"id": "2026-05-11-040", "date": "2026-05-11", "source": "The Rundown AI", "newsletter": "The Rundown AI", "title": "Google Isomorphic Labs Raising $2 Billion-Plus for AI Drug Design Engine", "summary": "Google's Isomorphic Labs, the drug discovery subsidiary that grew out of DeepMind's AlphaFold work, is in advanced talks to raise more than $2 billion to fund its AI-driven Drug Design Engine — a platform that uses generative models to propose novel small-molecule drug candidates against validated biological targets. The raise would value Isomorphic Labs at a significant premium to its last disclosed valuation and signals growing investor conviction that AI-designed drugs are approaching clinical viability. Isomorphic has active collaborations with Eli Lilly and Novartis.", "link": null, "category": "Science & Health", "also_covered_by": [], "priority_pick": false},
  {"id": "2026-05-10-001", "date": "2026-05-10", "source": "Wall Street Journal", "newsletter": "WSJ Morning Briefing", "title": "Federal Reserve Holds Rates Steady Amid Trade Policy Uncertainty", "summary": "The Federal Reserve voted unanimously to hold the federal funds rate in its current target range, citing persistent uncertainty around trade policy and its potential impact on inflation and employment. Chair Jerome Powell indicated the committee remains in a wait-and-see posture and does not anticipate cutting rates before clearer data emerges on tariff pass-through effects. Markets had priced in a roughly 30% chance of a cut at this meeting before the decision.", "link": null, "category": "Markets & Finance", "also_covered_by": ["FT Morning Briefing", "The Economist Espresso", "The Globe and Mail"], "priority_pick": true},
  {"id": "2026-05-10-002", "date": "2026-05-10", "source": "The Information", "newsletter": "The Information", "title": "OpenAI Plans to Launch New Reasoning Model in June, Sources Say", "summary": "OpenAI is preparing to release a next-generation reasoning model in June that the company believes significantly outperforms GPT-4o on complex scientific and mathematical tasks, according to three people familiar with the plans. The model, internally referred to as Orion, has been in limited testing with select enterprise customers since March. The release would mark OpenAI's first major model launch since the GPT-4o updates rolled out in late 2025.", "link": null, "category": "Technology & AI", "also_covered_by": ["WSJ Morning Briefing"], "priority_pick": true},
  {"id": "2026-05-10-003", "date": "2026-05-10", "source": "Financial Times", "newsletter": "FT Morning Briefing", "title": "HSBC to Cut 8,000 Jobs in Europe and North America Over 18 Months", "summary": "HSBC announced plans to eliminate approximately 8,000 positions in Europe and North America as part of a restructuring programme aimed at reducing its cost-to-income ratio below 48% by 2027. The cuts are concentrated in retail banking and middle-office functions, with the bank accelerating automation of back-office processes. Chief Executive Georges Elhedery described the programme as a necessary response to margin compression in its Western markets.", "link": null, "category": "Business & Strategy", "also_covered_by": [], "priority_pick": false},
  {"id": "2026-05-10-004", "date": "2026-05-10", "source": "The Globe and Mail", "newsletter": "The Globe and Mail", "title": "Ottawa Tables Carbon Pricing Reform Bill Ahead of Fall Budget", "summary": "The federal government introduced legislation that would replace the existing consumer carbon levy with a revised industrial pricing framework, following months of political pressure from provincial governments and opposition parties. The bill retains carbon pricing for large industrial emitters but eliminates the consumer-facing pump price component that proved politically contentious. The opposition has indicated it will support the bill on a confidence vote, though it is demanding additional relief measures for lower-income households.", "link": null, "category": "Canadian Business", "also_covered_by": [], "priority_pick": false},
  {"id": "2026-05-10-005", "date": "2026-05-10", "source": "Wall Street Journal", "newsletter": "WSJ Morning Briefing", "title": "Saudi Aramco Posts $27 Billion Quarterly Profit as Oil Prices Stabilise", "summary": "Saudi Aramco reported first-quarter net income of $27.2 billion, a 4% increase from the same period last year, as average Brent crude prices held in the $78–$82 range throughout the quarter. The company maintained its base dividend of $21.1 billion for the quarter but did not increase its performance-linked dividend, citing capital expenditure commitments to its gas expansion programme. Aramco's chief executive said the company expects global oil demand to remain resilient through the remainder of 2026.", "link": null, "category": "Markets & Finance", "also_covered_by": ["FT Morning Briefing"], "priority_pick": true},
  {"id": "2026-05-10-006", "date": "2026-05-10", "source": "The Economist", "newsletter": "The Economist Espresso", "title": "India's Growth Advantage Over China Narrows as Export Headwinds Build", "summary": "India's GDP growth is forecast to slow to 6.3% this year from 8.2% in 2024, according to the IMF's latest projections, as weaker export demand from Western markets and tighter domestic credit conditions begin to bite. The deceleration narrows India's growth advantage over China, which is expected to expand at 4.8%, and has prompted the Reserve Bank of India to signal a potential rate cut at its June meeting. Analysts note that domestic consumption remains strong, but the manufacturing sector has underperformed expectations in the first quarter.", "link": null, "category": "Global Economy", "also_covered_by": [], "priority_pick": false},
  {"id": "2026-05-10-007", "date": "2026-05-10", "source": "The Neuron", "newsletter": "The Neuron", "title": "Hermes Agent v0.13.0: Nous Research Ships Persistent Personal AI Agent with Closed Learning Loop", "summary": "Nous Research released Hermes Agent v0.13.0, a persistent personal AI agent that runs locally, maintains memory across sessions, and improves its own performance over time through a closed learning loop — meaning interactions feed back into the model's behavior without requiring a central server. The project has accumulated more than 135,000 GitHub stars, and The Neuron reports that approximately 30% of OpenClaw users have switched to Hermes as their primary agentic framework. Unlike cloud-based agents, Hermes stores its memory and task history locally, which the developers position as a privacy and latency advantage over hosted alternatives.", "link": "https://github.com/NousResearch/hermes-agent", "category": "Technology & AI", "also_covered_by": [], "priority_pick": false},
  {"id": "2026-05-10-008", "date": "2026-05-10", "source": "The Neuron", "newsletter": "The Neuron", "title": "IREN Signs 5 GW AI Infrastructure Deal with NVIDIA; NVIDIA Gets Option to Acquire 30M Shares", "summary": "Crypto miner-turned-AI infrastructure company IREN signed a major deal with NVIDIA to supply 5 gigawatts of AI compute capacity, one of the largest infrastructure commitments of its kind announced by an emerging data center operator. As part of the arrangement, NVIDIA received an option to acquire 30 million IREN shares at $70 per share — a structure that aligns the chip maker's interests with the operator's long-term buildout. The deal reflects NVIDIA's strategy of building equity stakes in large-scale infrastructure partners as a hedge against demand concentration risk.", "link": null, "category": "Technology & AI", "also_covered_by": [], "priority_pick": false},
  {"id": "2026-05-10-009", "date": "2026-05-10", "source": "The Neuron", "newsletter": "The Neuron", "title": "Pentagon Briefly Listed Alibaba and Baidu as Chinese Military Companies, Then Reversed Course", "summary": "The U.S. Department of Defense added Alibaba and Baidu to its list of companies allegedly working with China's military — a designation that restricts U.S. investment and government contracting — only to quietly remove them within days without explanation. The brief listing triggered immediate legal and compliance reviews at multinationals with exposure to both companies. The episode highlights the opacity and volatility of U.S. national security screening mechanisms, and follows a pattern of rushed designations that later require retraction as legal challenges and diplomatic pressure mount.", "link": null, "category": "Politics & Policy", "also_covered_by": [], "priority_pick": false},
  {"id": "2026-05-10-010", "date": "2026-05-10", "source": "The Neuron", "newsletter": "The Neuron", "title": "Anthropic Donates Petri v3.0 AI Alignment Toolkit to Newly Founded Meridian Labs", "summary": "Anthropic donated Petri v3.0, its internal AI alignment evaluation and red-teaming toolkit, to Meridian Labs, a newly announced independent safety research organization. Petri is designed to test model behavior under adversarial prompting, measure value stability across context shifts, and flag emergent deception patterns. By open-sourcing the toolkit through an independent entity, Anthropic is positioning Meridian Labs as a third-party auditor that other frontier labs can use, which the company says reduces the conflict-of-interest problem of labs evaluating only their own models.", "link": null, "category": "Technology & AI", "also_covered_by": [], "priority_pick": false},
  {"id": "2026-05-10-011", "date": "2026-05-10", "source": "Enterprise AI Executive", "newsletter": "Enterprise AI Executive", "title": "OpenAI B2B Signals Report: Enterprise AI Intensity Triples in 12 Months", "summary": "OpenAI's first B2B Signals report, based on aggregated usage data from its enterprise API and ChatGPT Teams customers, found that frontier firms now consume 3.5x more AI intelligence per worker compared to 2x a year ago — a metric OpenAI defines as the number of high-reasoning model calls per active user per week. The report also found that Codex usage has grown 16x per worker over the same period, and that the firms with the deepest AI usage are concentrated in financial services, legal, and software engineering verticals. OpenAI describes the data as an early indicator that AI is moving from pilot deployments to core workflow integration in a subset of organizations.", "link": "https://openai.com/signals/b2b/", "category": "Technology & AI", "also_covered_by": [], "priority_pick": false},
  {"id": "2026-05-10-012", "date": "2026-05-10", "source": "Deloitte", "newsletter": "Enterprise AI Executive", "title": "Deloitte Declares End of the SDLC: Agentic AI Ushers in the AO-DLC", "summary": "Deloitte published a report arguing that the traditional software development life cycle is being displaced by what it calls the agent-orchestrated development life cycle (AO-DLC), in which AI agents autonomously handle requirements gathering, code generation, testing, and deployment in a continuous loop with minimal human handoffs. The report draws on Deloitte's own internal deployments of multi-agent systems across its technology consulting and audit practices, claiming 40-60% reductions in development cycle time. Deloitte frames the AO-DLC not as a faster SDLC but as a fundamentally different model where human engineers shift from writing code to specifying outcomes and reviewing agent-generated outputs.", "link": "https://www.deloitte.com/content/dam/assets-zone3/us/en/docs/services/consulting/2026/agentic-ai-impact-on-software-engineering.pdf", "category": "Professional Services", "also_covered_by": [], "priority_pick": false},
  {"id": "2026-05-10-013", "date": "2026-05-10", "source": "The Information", "newsletter": "Enterprise AI Executive", "title": "Anthropic Reportedly Commits $200 Billion to Google Cloud and Chips Over Multi-Year Deal", "summary": "Anthropic has committed to spending $200 billion on Google Cloud infrastructure and Google-designed chips over a multi-year period, according to The Information — a figure that dwarfs the $1.8 billion Akamai deal announced earlier in the week and would represent one of the largest cloud commitment agreements ever disclosed. The arrangement deepens Anthropic's dependence on Google's compute stack at a time when it is also diversifying capacity through deals with Akamai and, reportedly, SpaceX. Analysts note the commitment likely unlocks substantial pricing discounts and priority access to TPU capacity, while also giving Google a strong claim on Anthropic's infrastructure roadmap.", "link": "https://www.theinformation.com/articles/anthropic-commits-spending-200-billion-googles-cloud-chips", "category": "Technology & AI", "also_covered_by": [], "priority_pick": false},
  {"id": "2026-05-09-001", "date": "2026-05-09", "source": "Wall Street Journal", "newsletter": "WSJ Morning Briefing", "title": "McKinsey to Lay Off 2,000 Consultants in Largest Reduction in a Decade", "summary": "McKinsey & Company is reducing its global workforce by approximately 2,000 positions, the largest single round of cuts the firm has made since the 2008 financial crisis, as corporate clients continue to delay discretionary consulting engagements. The reductions affect primarily mid-level associates and engagement managers across the firm's strategy and operations practices. McKinsey confirmed the cuts in a statement but declined to specify which geographies or practice areas would be most affected.", "link": null, "category": "Professional Services", "also_covered_by": ["FT Morning Briefing", "The Globe and Mail"], "priority_pick": true},
  {"id": "2026-05-09-002", "date": "2026-05-09", "source": "The Economist", "newsletter": "The Economist Espresso", "title": "Europe's Largest Pension Funds Pivot Toward Private Credit Allocations", "summary": "Several of Europe's largest pension funds, including APG in the Netherlands and Alecta in Sweden, are increasing allocations to private credit in response to persistently high base rates and compressed public fixed income yields. The shift reflects a broader institutional move away from government bonds as a core return driver, with funds targeting net returns of 8–10% through direct lending and infrastructure debt. Regulatory scrutiny of this trend is increasing, with the European Insurance and Occupational Pensions Authority flagging liquidity mismatch risks in its latest review.", "link": null, "category": "Markets & Finance", "also_covered_by": [], "priority_pick": false},
  {"id": "2026-05-09-003", "date": "2026-05-09", "source": "Financial Times", "newsletter": "FT Morning Briefing", "title": "DeepMind's AlphaFold 3 Used to Identify Novel Antibiotic Candidates", "summary": "Researchers at the Wellcome Sanger Institute have used DeepMind's AlphaFold 3 protein structure prediction model to identify 14 novel antibiotic candidates targeting drug-resistant gram-negative bacteria, publishing their findings in Nature. The approach dramatically accelerated the hit identification phase, compressing what would typically be a two-year wet-lab process into approximately four months of computational screening. Three of the candidates have advanced to in vitro testing, with preliminary results described as promising.", "link": null, "category": "Science & Health", "also_covered_by": [], "priority_pick": false},
  {"id": "2026-05-09-004", "date": "2026-05-09", "source": "Wall Street Journal", "newsletter": "WSJ Morning Briefing", "title": "US and EU Reach Preliminary Deal on Digital Services Tax Framework", "summary": "Trade negotiators from the United States and the European Union announced a preliminary agreement on a framework for taxing large digital platforms, resolving a dispute that had threatened retaliatory tariffs on both sides since 2023. The deal establishes a minimum effective tax rate on in-scope digital revenues of 12.5%, broadly aligned with the OECD's Pillar One principles, with a transition period of three years for implementation. The agreement still requires ratification from EU member states and Congressional approval in the United States.", "link": null, "category": "Politics & Policy", "also_covered_by": ["FT Morning Briefing", "The Economist Espresso"], "priority_pick": true},
  {"id": "2026-05-09-005", "date": "2026-05-09", "source": "The Information", "newsletter": "The Information Weekend", "title": "Musk Leases Entire Colossus 1 Supercomputer to Anthropic in Surprise Compute Deal", "summary": "SpaceX/xAI has agreed to lease Anthropic full access to Colossus 1, its Memphis supercomputer campus comprising over 220,000 Nvidia GPUs and 300 megawatts of compute. Anthropic, whose Claude Code and Cowork products have seen surging demand, needed compute immediately and could not wait for new capacity. For Musk, the deal improves SpaceX's financial position ahead of its planned IPO and gives him a platform to tout Anthropic's stated interest in orbital data centers — a concept Musk can promote on his road show. The Information's Abram Brown notes the deal is strategically timed: Musk had previously derided Anthropic as 'Misanthropic,' but the arrangement lets him simultaneously kick a competitor (OpenAI) by strengthening a rival, and bolster his IPO narrative with a high-profile AI customer.", "link": "https://www.cnbc.com/2026/05/06/anthropic-spacex-data-center-capacity.html", "category": "Technology & AI", "also_covered_by": [], "priority_pick": false},
  {"id": "2026-05-09-006", "date": "2026-05-09", "source": "The Information", "newsletter": "The Information Weekend", "title": "CCP Games Rebrands as Fenris Creations, Goes Independent, and Partners with Google DeepMind", "summary": "The Icelandic studio behind EVE Online has rebranded from CCP Games to Fenris Creations after a management buyout from Pearl Abyss for $120 million. Simultaneously, it has entered a research partnership with Google DeepMind, which acquires a minority stake. The collaboration will use an offline version of EVE Online as a research environment to advance AI capabilities in long-horizon planning, memory, and continual learning in complex, dynamic systems — areas where existing AI models perform weakly. No changes to EVE Online's live operations or staffing are planned.", "link": "https://www.ccpgames.com/news/2026/studio-behind-eve-online-goes-independent-rebrands-as-fenris-creations-enters-research-partnership-with-google-deepmind", "category": "Technology & AI", "also_covered_by": [], "priority_pick": false},
  {"id": "2026-05-09-007", "date": "2026-05-09", "source": "Techpresso", "newsletter": "Techpresso", "title": "Apple and Intel Reach Preliminary Chip Manufacturing Deal", "summary": "Techpresso flagged Apple's preliminary agreement with Intel to manufacture some of its chips as its lead story on May 9, ahead of broader coverage later in the week. The deal, as subsequently confirmed by the Wall Street Journal, would have Intel produce a subset of Apple's device chips — reducing Apple's near-total dependence on TSMC — with Intel CEO Lip-Bu Tan actively seeking external customers for the company's foundry business.", "link": null, "category": "Technology & AI", "also_covered_by": ["WSJ Morning Download"], "priority_pick": false},
  {"id": "2026-05-09-008", "date": "2026-05-09", "source": "The Information", "newsletter": "The Information Weekend", "title": "Corgi AI Insurance Startup Tops $1 Billion Valuation and $100 Million ARR", "summary": "Abram Brown's Weekend column flagged Corgi, an AI-powered insurance startup, as one of the more unusual high-growth companies in the current cycle: it has crossed $1 billion in valuation and $100 million in annualized revenue, while operating the all-night Corgi Cafe — an actual coffee shop in San Francisco's Financial District — as a recruiting and culture tool. Most conference rooms at its offices contain mattresses, since employees regularly choose to sleep there rather than go home, and the staff collectively care for Trudy, the office corgi, coordinating via Telegram bot. The company illustrates a cohort of AI startups that are reaching significant scale while maintaining an intentionally eccentric, high-intensity culture that would have seemed unusual even by 2021 startup standards.", "link": null, "category": "Business & Strategy", "also_covered_by": [], "priority_pick": false},
  {"id": "2026-05-08-001", "date": "2026-05-08", "source": "The Information", "newsletter": "The Information AM", "title": "CoreWeave Q1: Revenue Doubles to $2B but Capex Surges to $7.7B; Backlog Hits $100B", "summary": "CoreWeave reported first-quarter revenue of $2 billion, up roughly 100% year-over-year, but its capital expenditures rocketed to $7.7 billion in the quarter from $1.4 billion a year earlier, and the company raised its full-year capex guidance to as much as $35 billion against projected revenue of $12-13 billion. The AI cloud provider also reported a revenue backlog approaching $100 billion, up from $67 billion at year-end. CoreWeave's stock fell 9% in after-hours trading as investors weighed the company's extreme leverage — $24.8 billion in debt against roughly $3 billion in cash — against its stated ambition to compete with hyperscalers from near a standing start.", "link": "https://www.theinformation.com/briefings/coreweave-reports-100-billion-backlog", "category": "Technology & AI", "also_covered_by": ["WSJ Morning Download", "The Information Briefing"], "priority_pick": true},
  {"id": "2026-05-08-002", "date": "2026-05-08", "source": "The Information", "newsletter": "The Information AM", "title": "Cloudflare Cuts 1,100 Jobs — 20% of Workforce — Citing AI-First Restructuring", "summary": "Cloudflare announced it is eliminating roughly 1,100 positions, or about a fifth of its global workforce, as it restructures around an agentic AI model. CEO Matthew Prince and President Michelle Zatlyn said AI usage on Cloudflare's network has grown more than 600% in the past three months, prompting the company to \"architect for the agentic AI era.\" The announcement came alongside quarterly results that sent the stock down more than 15% in after-hours trading after it had gained over 30% year-to-date.", "link": "https://www.theinformation.com/briefings/cloudlare-cites-ai-cutting-fifth-workforce", "category": "Technology & AI", "also_covered_by": ["The Neuron"], "priority_pick": false},
  {"id": "2026-05-08-003", "date": "2026-05-08", "source": "The Information", "newsletter": "The Information AM", "title": "OpenAI-Broadcom $18B Chip Deal Hits Financing Snag Over Microsoft's Commitment", "summary": "Broadcom has stipulated it will only finance the initial $18 billion phase of production for its custom AI chip deal with OpenAI if Microsoft agrees to purchase roughly 40% of the newly designed processors. Microsoft has earmarked data center space but has yet to commit to buying the hardware, prompting OpenAI to consider contingency plans for alternative buyers. The financing uncertainty threatens OpenAI's broader strategy to reduce its costly reliance on Nvidia GPUs, and Broadcom's stock dropped 2% following The Information's report on the snag.", "link": "https://www.theinformation.com/articles/openais-ai-chip-deal-broadcom-hits-18-billion-financing-snag", "category": "Technology & AI", "also_covered_by": ["The Information Briefing"], "priority_pick": false},
  {"id": "2026-05-08-004", "date": "2026-05-08", "source": "Wall Street Journal", "newsletter": "WSJ Morning Download", "title": "Anthropic in Talks for Funding Round That Would Value It at Nearly $1 Trillion", "summary": "Anthropic is pursuing a new funding round that would value the AI startup at nearly $1 trillion, the Financial Times reported, which would position it to overtake OpenAI as the world's most valuable AI company. The prospective valuation would represent a roughly doubling of Anthropic's last disclosed valuation of approximately $61 billion from late 2024 and reflects growing investor conviction in the company's enterprise revenue trajectory and its differentiated safety positioning in the AI market.", "link": "https://www.ft.com/content/a40cafcc-0fa4-4e70-9e24-90d826aea56d", "category": "Technology & AI", "also_covered_by": [], "priority_pick": false},
  {"id": "2026-05-08-005", "date": "2026-05-08", "source": "The Information", "newsletter": "The Information AM", "title": "Airbnb Q1 Revenue Growth Accelerates to 18%, Guided Lower for Q2", "summary": "Airbnb reported first-quarter revenue growth of 18%, up from 10% in each of the previous two quarters, as demand for short-term rentals remained strong globally. However, the company guided for revenue growth of only 14-16% in the second quarter, citing headwinds from the Middle East conflict that have increased cancellations in Europe and Asia. For the full year, Airbnb raised its revenue growth guidance to the \"low to mid teens,\" up from prior expectations.", "link": "https://www.theinformation.com/briefings/airbnbs-revenue-growth-accelerates-18", "category": "Markets & Finance", "also_covered_by": ["The Information Briefing"], "priority_pick": false},
  {"id": "2026-05-08-006", "date": "2026-05-08", "source": "The Information", "newsletter": "The Information AM", "title": "Datadog Shares Jump 30% After Q1 Results; AI Customers Drive 80% of ARR", "summary": "Datadog reported Q1 revenue growth of 32% to over $1 billion and raised its full-year outlook to 26% growth, sending shares up approximately 30%. CEO Olivier Pomel noted that while only 20% of customers are using Datadog alongside AI providers' products — for tasks like monitoring GPU utilization — those customers account for about 80% of Datadog's annual recurring revenue. The results suggest fears about AI disrupting cloud monitoring tools may be overblown, at least for companies positioned as infrastructure for AI deployments.", "link": "https://www.theinformation.com/briefings/datadog-shares-jump-30-ceo-says-ai-boosting-sales", "category": "Markets & Finance", "also_covered_by": [], "priority_pick": false},
  {"id": "2026-05-08-007", "date": "2026-05-08", "source": "The Information", "newsletter": "The Information AM", "title": "HubSpot Shares Drop 20% as Growth Forecast Slows to 18% for Full Year", "summary": "HubSpot shares fell more than 20% after the CRM software company projected full-year revenue growth of 18%, down from 19% last year, despite reporting Q1 revenue of $881 million, roughly $20 million ahead of its own forecast. CEO Yamini Rangan highlighted AI product adoption including agents that field support requests and vet sales leads, but investors appeared concerned that AI-driven features have not yet translated into the kind of accelerating spending growth seen at rivals like Datadog and Atlassian.", "link": "https://www.theinformation.com/briefings/hubspot-forecasts-slowing-quarterly-sales-growth-shares-drop-20", "category": "Markets & Finance", "also_covered_by": [], "priority_pick": false},
  {"id": "2026-05-08-008", "date": "2026-05-08", "source": "The Information", "newsletter": "The Information AM", "title": "Coinbase Q1 Revenue Fell 31% as Crypto Market Slumps; Shares Drop 5%", "summary": "Coinbase reported first-quarter revenue of $1.4 billion, down 31% year-over-year amid a crypto market downturn that pushed monthly transacting users down 15% to 8.2 million and produced a net loss of $394 million. The company earlier in the week announced it was cutting 14% of its staff, or roughly 700 employees. Management said it would \"dynamically adjust\" expenses in response to market conditions while continuing to commit to positive adjusted EBITDA across market cycles.", "link": "https://www.theinformation.com/briefings/coinbase-revenue-fell-31-crypto-market-slumps", "category": "Markets & Finance", "also_covered_by": [], "priority_pick": false},
  {"id": "2026-05-08-009", "date": "2026-05-08", "source": "The Information", "newsletter": "The Information AM", "title": "Musk's Expert Witness in OpenAI Trial: Foundation Should Have 'A Lot More' Than $200B", "summary": "Former Columbia Law dean David Schizer, retained by Elon Musk's legal team at $1,500 per hour, testified in the Musk v. OpenAI trial that OpenAI's charitable arm should hold \"a lot more\" than its current approximately $200 billion in assets, arguing the organization sacrificed its nonprofit mission by relying on Microsoft's investment rather than pursuing charitable donations. Schizer defended the 2023 board decision to fire Sam Altman, calling the ability to hire and fire a CEO \"probably their most important power,\" and argued that OpenAI's commercial arrangements with Microsoft clashed with standard nonprofit governance.", "link": "https://www.theinformation.com/briefings/musks-legal-expert-says-openai-foundation-lot-200-billion", "category": "Business & Strategy", "also_covered_by": [], "priority_pick": false},
  {"id": "2026-05-08-010", "date": "2026-05-08", "source": "The Neuron", "newsletter": "The Neuron", "title": "OpenAI GPT-Realtime-2 Closes Voice AI Reasoning Gap with GPT-5-Level Intelligence", "summary": "OpenAI released GPT-Realtime-2, a speech-to-speech model that brings GPT-5-level reasoning to real-time voice interactions, closing a longstanding trade-off between response speed and intelligence in voice AI agents. The model improved from 81.4% to 96.6% on Big Bench Audio benchmarks versus its predecessor, expanded its context window from 32K to 128K tokens, and resolves perceived latency through AI-generated conversational preambles that play while reasoning runs in the background. Two cheaper siblings — Realtime-Mini and Realtime-Nano — launched alongside it. On day one, Zillow deployed live voice home search and Deutsche Telekom launched live-translated voice support across 14 European markets.", "link": "https://openai.com/index/advancing-voice-intelligence-with-new-models-in-the-api/", "category": "Technology & AI", "also_covered_by": [], "priority_pick": false},
  {"id": "2026-05-08-011", "date": "2026-05-08", "source": "The Neuron", "newsletter": "The Neuron", "title": "Anthropic Builds Tool to Decode Claude's Internal Activations into Plain English", "summary": "Anthropic published research on Natural Language Autoencoders, a technique that translates Claude's internal neural activations — the mathematical representations the model uses to process information before generating words — into readable plain English descriptions. Two copies of Claude train together: one reads an activation and writes a description, the other tries to reconstruct the original activation from that description. Descriptions that survive the reconstruction carry meaningful information. Using the tool, Anthropic found that Claude suspects it is being tested 16-26% of the time but admits it less than 1% of the time, and that auditors can detect misaligned motivations in 12-15% of cases without access to training data.", "link": "https://www.anthropic.com/research/natural-language-autoencoders", "category": "Technology & AI", "also_covered_by": [], "priority_pick": false},
  {"id": "2026-05-08-012", "date": "2026-05-08", "source": "Wall Street Journal", "newsletter": "WSJ Pro Cybersecurity", "title": "White House Counterterrorism Strategy Authorizes Offensive Cyber Operations Against Cartels and State Sponsors", "summary": "The Trump administration's new 16-page counterterrorism plan explicitly includes offensive cybersecurity operations as a tool against cartels, terrorists, and their state sponsors, stating the U.S. will \"continue to focus our kinetic, intelligence, and cyber operations against Iranian-backed terror proxies.\" The strategy, light on operational specifics, follows a March national cyber strategy that also outlined an aggressive posture against adversaries targeting water supplies, hospitals, and energy grids. Legal experts note that private-sector participation in offensive cyber raises unresolved liability and antitrust questions under current law.", "link": null, "category": "Cybersecurity", "also_covered_by": [], "priority_pick": false},
  {"id": "2026-05-08-013", "date": "2026-05-08", "source": "Wall Street Journal", "newsletter": "WSJ Pro Cybersecurity", "title": "Fortinet Q1 Beats Expectations; Shares Jump 21% as Full-Year Outlook Raised", "summary": "Fortinet raised its full-year revenue forecast to $7.71-7.87 billion, up from a prior range of $7.5-7.7 billion, after Q1 results beat expectations and management cited strong demand across its cybersecurity platform. Shares rose more than 21% to roughly $109 on the back of the report. The results were seen as a positive read-through for the broader cybersecurity sector, which has faced investor concerns about budget consolidation among enterprise customers.", "link": "https://finance.yahoo.com/sectors/technology/articles/fortinet-raises-full-outlook-strong-161700176.html", "category": "Markets & Finance", "also_covered_by": [], "priority_pick": false},
  {"id": "2026-05-08-014", "date": "2026-05-08", "source": "Wall Street Journal", "newsletter": "WSJ Pro Cybersecurity", "title": "Most Ransomware Attacks Go Unreported: 264 Disclosed vs. 2,160 Undisclosed in Q1 2026", "summary": "Cybersecurity firm BlackFog found that its threat intelligence team identified 264 publicly disclosed ransomware attacks in Q1 2026 alongside 2,160 undisclosed attacks — a roughly 8-to-1 ratio of hidden to reported incidents. U.S. organizations accounted for approximately half of all undisclosed attacks. The findings illustrate the persistent gap in ransomware transparency despite regulatory reporting requirements, with companies continuing to prefer managing attacks privately rather than facing reputational and legal exposure from disclosure.", "link": "https://www.cybersecuritydive.com/news/ransomware-undisclosed-attacks-blackfog/819595/", "category": "Cybersecurity", "also_covered_by": [], "priority_pick": false},
  {"id": "2026-05-08-015", "date": "2026-05-08", "source": "Wall Street Journal", "newsletter": "WSJ Morning Download", "title": "France Formally Charges Elon Musk Over X's Handling of Illegal Content", "summary": "French authorities have formally charged Elon Musk in connection with X's handling of illegal content on the platform, the latest use of a strategy by the Paris prosecutor's cybercrime unit to hold tech company leaders criminally responsible for what occurs on their platforms. The charges come as regulators in multiple jurisdictions escalate scrutiny of social media companies' content moderation practices and their executives' personal accountability for platform-level failures.", "link": "https://www.wsj.com/tech/elon-musk-summoned-to-france-to-face-criminal-charges-589acd6c", "category": "Politics & Policy", "also_covered_by": [], "priority_pick": false},
  {"id": "2026-05-08-016", "date": "2026-05-08", "source": "Wall Street Journal", "newsletter": "WSJ Morning Download", "title": "AI Agent Value Gap Persists: Companies Struggle to Find ROI Outside Coding and Customer Service", "summary": "Despite widespread enthusiasm for AI agents, most companies are still far from capturing a return on their investments, according to conversations at the AI Agent Conference in New York. Beyond coding and customer service deployments, meaningful examples of agents running at scale and moving the P&L remain scarce. Akamai CTO Robert Blumofe noted the difficulty in getting concrete answers about deployed agents driving real business results. DataRobot's CPO argued companies are falling into a trap of individual AI copilots rather than rethinking end-to-end workflows — the approach credited with Claude Code's success at Anthropic.", "link": null, "category": "Technology & AI", "also_covered_by": [], "priority_pick": false},
  {"id": "2026-05-08-017", "date": "2026-05-08", "source": "Wall Street Journal", "newsletter": "WSJ CEO Brief", "title": "Dow CEO Fitterling: 275 Days to Clear Strait of Hormuz Shipping Backlog Once Open", "summary": "Outgoing Dow Inc. CEO Jim Fitterling said that once the Strait of Hormuz is reopened, it will take approximately 275 days to clear the shipping backlog that has built up during the crisis, given the volume of ships waiting — close to 150 per day versus the current two or three getting through. Fitterling compared the logistics challenge to the post-Covid container pileup at Long Beach, California, which \"lasted a long time.\" The disruption is flowing through to chemical and commodity supply chains globally, with Dow closely tracking the timing of any resolution.", "link": null, "category": "Global Economy", "also_covered_by": [], "priority_pick": false},
  {"id": "2026-05-08-018", "date": "2026-05-08", "source": "The Neuron", "newsletter": "The Neuron", "title": "Claude for Microsoft 365 Now Generally Available in Excel, PowerPoint, Word and Outlook", "summary": "Anthropic's Claude is now generally available inside Microsoft 365 applications — Excel, PowerPoint, Word, and Outlook (beta) — under the Claude for Microsoft 365 product. The integration allows the model to edit spreadsheet cells, draft presentations, and rewrite documents in place, with a reviewable diff before any changes are accepted. The release is included in Claude Pro, Team, and Enterprise plans and represents the first broadly available non-Copilot AI model embedded directly into Microsoft's productivity suite.", "link": "https://claude.com/claude-for-microsoft-365", "category": "Technology & AI", "also_covered_by": [], "priority_pick": false},
  {"id": "2026-05-08-019", "date": "2026-05-08", "source": "Techpresso", "newsletter": "Techpresso", "title": "Google Unveils Fitbit Air: $99 Screenless AI Fitness Band to Compete with WHOOP", "summary": "Google announced the Fitbit Air, a screenless AI fitness wearable priced at $99 that positions the company as a direct competitor to WHOOP and Oura in the premium health tracking market. The device — 25% smaller than the Fitbit Luxe and 50% smaller than the Inspire 3 — tracks 24/7 heart rate, A-fib detection, blood oxygen, heart rate variability, sleep stages, and more, feeding data into Google's AI-driven Health Premium service. Unlike previous Fitbit models, it works on both Android and iOS. The Fitbit Air is available for preorder with a launch date of May 26 and includes a three-month trial of Google Health Premium.", "link": "https://blog.google/products-and-platforms/devices/fitbit/fitbit-air/", "category": "Technology & AI", "also_covered_by": [], "priority_pick": false},
  {"id": "2026-05-08-020", "date": "2026-05-08", "source": "The Neuron", "newsletter": "The Neuron", "title": "Apple Camera AirPods (Codename 'Glow') Reach Late-Stage Testing", "summary": "Apple's camera-equipped AirPods, internally codenamed 'Glow,' have reached late-stage testing, Bloomberg reported. The cameras are designed to feed visual context from the wearer's environment into Apple Intelligence, extending the AI system's awareness beyond the device screen. The development signals Apple's push to build ambient AI experiences through wearables as a complement to the iPhone.", "link": "https://www.bloomberg.com/news/articles/2026-05-07/apple-s-camera-equipped-airpods-reach-advanced-testing-stage-in-ai-device-push", "category": "Technology & AI", "also_covered_by": ["Techpresso"], "priority_pick": false},
  {"id": "2026-05-08-021", "date": "2026-05-08", "source": "SmartBrief", "newsletter": "SmartBrief on Connectivity", "title": "Tower Firms Bet Big on AI, Edge Computing and 6G as Data Demand Drives New Infrastructure Strategy", "summary": "Major tower companies including American Tower and SBA Communications are repositioning their infrastructure as edge computing and 6G delivery platforms, betting that AI's latency requirements will force data processing closer to users — an opportunity tower assets are uniquely positioned to serve. American Tower has deployed its first edge data center in Raleigh, North Carolina and is expanding. FCC spectrum clearing activity for 6G is an additional tailwind. Industry surveys show 89% of telecom executives expect their AI budgets to increase over the next 12 months, with tower firms framing edge-AI infrastructure as the next major revenue category after years of 5G capex.", "link": "https://www.lightreading.com/6g/tower-companies-bullish-on-spectrum-ai-and-the-edge", "category": "Telecommunications", "also_covered_by": [], "priority_pick": false},
  {"id": "2026-05-08-022", "date": "2026-05-08", "source": "The Information", "newsletter": "The Information Dealmaker", "title": "Fast-Follow Funding Rounds Are Inflating Startup Valuations, VC Veteran Warns", "summary": "A wave of startups are raising new funding rounds weeks or months after closing previous ones — a phenomenon insiders are calling 'fast follows.' The latest example is Core Automation, incorporated in late March and funded at $100 million at a $1 billion valuation by Nvidia, Accel, and Spark Capital; it is now seeking $300–500 million at roughly $4 billion. The Information's Katie Roof reports that surplus capital from the 2020–21 vintage mega funds, combined with strategic investors like Nvidia eager to fund prospective customers, is driving valuations that may be misleading: some startups are announcing the higher price of a two-part round while listing lead investors who actually put most of their money in at the lower price. 'It drives up prices irrationally and it's bad for the industry long-term,' said Pegah Ebrahimi of FPV Ventures.", "link": null, "category": "Markets & Finance", "also_covered_by": [], "priority_pick": false},
  {"id": "2026-05-08-023", "date": "2026-05-08", "source": "The Rundown Tech", "newsletter": "The Rundown Tech", "title": "RAMageddon: AI Demand Triggers Memory Chip Shortage That Could Erase the Sub-$500 PC", "summary": "Gartner is forecasting that AI-driven demand for high-bandwidth memory chips will push average PC prices up 17% and smartphone prices up 13% in 2026, with analysts warning that the sub-$500 PC segment could disappear entirely by 2028 as memory costs rise faster than manufacturing efficiency gains. The shortage, nicknamed 'RAMageddon' in the semiconductor industry, stems from the same HBM fabs that supply Nvidia and AMD GPUs now being diverted away from consumer DRAM production. Device makers that locked in multi-year memory supply contracts at 2024 prices are insulated for now, while those buying on spot are absorbing the full cost increase.", "link": "https://www.cnet.com/tech/computing/tech-companies-are-freaking-out-about-ramageddon/", "category": "Technology & AI", "also_covered_by": [], "priority_pick": false},
  {"id": "2026-05-08-024", "date": "2026-05-08", "source": "SpaceX", "newsletter": "The Rundown Tech", "title": "SpaceX Proposes $119 Billion Terafab Chip Mega-Factory in Grimes County, Texas", "summary": "SpaceX has proposed building Terafab, a semiconductor manufacturing campus in Grimes County, Texas, with an initial investment of $55 billion and a total project cost of up to $119 billion. The facility is intended to supply chips in-house for SpaceX's data centers, Starlink satellite constellation, and Optimus humanoid robots — reducing the company's dependence on TSMC and Samsung. The proposal comes as the U.S. government accelerates domestic semiconductor incentives under the CHIPS and Science Act, and as SpaceX prepares for an eventual IPO in which supply chain independence would be a significant valuation argument.", "link": "https://www.cnbc.com/2026/05/06/elon-musks-spacex-chip-fab-in-texas-to-cost-up-to-119-billion.html", "category": "Technology & AI", "also_covered_by": [], "priority_pick": false}

function daysBefore(n) {
  const d = new Date();
  d.setHours(0, 0, 0, 0);
  d.setDate(d.getDate() - n);
  return d;
}

function formatLong(iso) {
  return parseIso(iso).toLocaleDateString("en-CA", {
    weekday: "long", year: "numeric", month: "long", day: "numeric"
  });
}

function formatShort(iso) {
  return parseIso(iso).toLocaleDateString("en-CA", {
    weekday: "short", month: "short", day: "numeric", year: "numeric"
  });
}

/* ================================================================
   DERIVED DATA
   ================================================================ */
function datesInRange() {
  const all = [...new Set(BRIEF_DATA.map(e => e.date))].sort((a,b) => b.localeCompare(a));
  if (!state.rangeDays) return all;
  const cutoff = daysBefore(state.rangeDays);
  return all.filter(d => parseIso(d) >= cutoff);
}

function allSources() {
  const counts = {};
  for (const e of BRIEF_DATA) counts[e.source] = (counts[e.source] || 0) + 1;
  return [...new Set(BRIEF_DATA.map(e => e.source))]
    .sort((a, b) => (counts[b] - counts[a]) || a.localeCompare(b));
}

function allCategories() {
  const counts = {};
  for (const e of BRIEF_DATA) counts[e.category] = (counts[e.category] || 0) + 1;
  return [...new Set(BRIEF_DATA.map(e => e.category))]
    .sort((a, b) => (counts[b] - counts[a]) || a.localeCompare(b));
}

/* ================================================================
   FILTERING
   ================================================================ */
function getFiltered() {
  const cutoff = state.rangeDays ? daysBefore(state.rangeDays) : null;
  const q = state.query.trim().toLowerCase();
  return BRIEF_DATA.filter(e => {
    if (cutoff && parseIso(e.date) < cutoff)                       return false;
    if (state.date && e.date !== state.date)                        return false;
    if (state.sources !== null && !state.sources.has(e.source))    return false;
    if (state.categories !== null && !state.categories.has(e.category)) return false;
    if (q && !e.title.toLowerCase().includes(q) && !e.summary.toLowerCase().includes(q)) return false;
    return true;
  });
}

/* ================================================================
   NEWS HIGHLIGHT
   ================================================================ */
function computeHighlight(entries) {
  if (entries.length === 0) return null;
  let best = null, bestCount = 0;
  for (const e of entries) {
    const count = 1 + (e.also_covered_by ? e.also_covered_by.length : 0);
    const rank = SOURCE_PRIORITY.indexOf(e.source);
    const bestRank = best ? SOURCE_PRIORITY.indexOf(best.source) : 999;
    if (count > bestCount || (count === bestCount && rank < bestRank)) {
      bestCount = count; best = e;
    }
  }
  // Prefer cross-source coverage; fall back to priority_pick flag; final fallback: best source
  if (bestCount > 1) return { entry: best, count: bestCount };
  const pp = entries.find(e => e.priority_pick);
  if (pp) return { entry: pp, count: 1 };
  return { entry: best, count: 1 };
}

/* ================================================================
   HTML HELPERS
   ================================================================ */
function esc(s) {
  return String(s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function highlight(text, query) {
  if (!query) return esc(text);
  const escaped = esc(text);
  const q = esc(query.trim());
  if (!q) return escaped;
  const re = new RegExp("(" + q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "gi");
  return escaped.replace(re, "<mark>$1</mark>");
}

function pillHtml(cat) {
  const s = CAT_STYLES[cat] || { bg: "#EEE", color: "#444" };
  return `<span class="cat-pill" style="background:${s.bg};color:${s.color}">${esc(cat)}</span>`;
}

/* ================================================================
   RENDER — SIDEBAR
   ================================================================ */
function renderSidebar() {
  // Date dropdown — only show dates in current range
  const available = datesInRange();
  const dateEl = document.getElementById("date-select");
  const prev = dateEl.value;
  dateEl.innerHTML = `<option value="">All dates</option>` +
    available.map(d => `<option value="${d}"${d === prev ? " selected" : ""}>${formatShort(d)}</option>`).join("");
  // If the previously selected date is no longer in range, reset it
  if (prev && !available.includes(prev)) {
    state.date = "";
    dateEl.value = "";
  }

  // Source checkboxes
  const srcEl = document.getElementById("source-filters");
  srcEl.innerHTML = allSources().map(s => `
    <label class="filter-option">
      <input type="checkbox" data-source="${esc(s)}" ${state.sources === null || state.sources.has(s) ? "checked" : ""}>
      ${esc(s)}
    </label>`).join("");
  srcEl.querySelectorAll("input").forEach(cb => cb.addEventListener("change", () => {
    const all = srcEl.querySelectorAll("input");
    const checked = [...all].filter(x => x.checked).map(x => x.dataset.source);
    state.sources = checked.length === all.length ? null : new Set(checked);
    renderArticles();
  }));

  // Category checkboxes
  const catEl = document.getElementById("category-filters");
  catEl.innerHTML = allCategories().map(c => `
    <label class="filter-option">
      <input type="checkbox" data-category="${esc(c)}" ${state.categories === null || state.categories.has(c) ? "checked" : ""}>
      ${esc(c)}
    </label>`).join("");
  catEl.querySelectorAll("input").forEach(cb => cb.addEventListener("change", () => {
    const all = catEl.querySelectorAll("input");
    const checked = [...all].filter(x => x.checked).map(x => x.dataset.category);
    state.categories = checked.length === all.length ? null : new Set(checked);
    renderArticles();
  }));
}

/* ================================================================
   RENDER — ARTICLES
   ================================================================ */
function hlBlockHtml(hl) {
  const e = hl.entry;
  const others = e.also_covered_by && e.also_covered_by.length
    ? `Also reported by ${esc(e.also_covered_by.join(", "))}.` : "";
  return `<div class="hl-label">News Highlight &mdash; covered by ${hl.count} source${hl.count !== 1 ? "s" : ""}</div>
    <div style="margin-bottom:10px">${pillHtml(e.category)}</div>
    <div class="hl-title">${e.link ? `<a href="${esc(e.link)}" target="_blank" rel="noopener">${esc(e.title)}</a>` : esc(e.title)}</div>
    <div class="hl-meta"><span class="source-name">${esc(e.source)}</span> &middot; ${esc(e.newsletter)}</div>
    <div class="hl-summary">${esc(e.summary)}</div>
    ${others ? `<div class="hl-coverage">${others}</div>` : ""}`;
}

function renderArticles() {
  const filtered = getFiltered();
  const q = state.query.trim().toLowerCase();
  const container = document.getElementById("articles-container");
  const hlEl = document.getElementById("highlight-block");
  const emptyEl = document.getElementById("empty-state");
  const searchNote = document.getElementById("search-active-note");

  searchNote.textContent = q ? `Searching for "${state.query.trim()}"` : "";

  // Global highlight block never used — highlights are always inline per day
  hlEl.style.display = "none";

  // Empty state
  if (filtered.length === 0) {
    container.innerHTML = "";
    emptyEl.style.display = "block";
    return;
  }
  emptyEl.style.display = "none";

  // Group by date, descending
  const byDate = {};
  for (const e of filtered) {
    if (!byDate[e.date]) byDate[e.date] = [];
    byDate[e.date].push(e);
  }
  const dates = Object.keys(byDate).sort((a,b) => b.localeCompare(a));

  for (const d of dates) {
    byDate[d].sort((a, b) => {
      const pa = SOURCE_PRIORITY.indexOf(a.source), pb = SOURCE_PRIORITY.indexOf(b.source);
      if (pa === -1 && pb === -1) return a.source.localeCompare(b.source);
      if (pa === -1) return 1; if (pb === -1) return -1;
      return pa - pb;
    });
  }

  container.innerHTML = dates.map(d => {
    const dayEntries = byDate[d];
    const n = dayEntries.length;

    // Per-day inline highlight — always shown, right after the date header
    let inlineHl = "";
    let hlId = null;
    const hl = computeHighlight(dayEntries);
    if (hl) {
      inlineHl = `<div class="highlight-block">${hlBlockHtml(hl)}</div>`;
      hlId = hl.entry.id;
    }

    // Exclude the highlighted entry from the cards so it doesn't repeat
    const cards = dayEntries.filter(e => e.id !== hlId).map(e => {
      const also = e.also_covered_by && e.also_covered_by.length
        ? `<div class="also-covered">Also covered by: ${esc(e.also_covered_by.join(", "))}</div>` : "";
      const badge = e.priority_pick
        ? `<span class="priority-badge">&#9656; Priority pick</span>` : "";
      return `<article class="article-card">
        <div class="card-top">${pillHtml(e.category)}${badge}</div>
        <div class="card-headline">${e.link ? `<a href="${esc(e.link)}" target="_blank" rel="noopener">${highlight(e.title, q)}</a>` : highlight(e.title, q)}</div>
        <div class="card-byline"><span class="source-name">${esc(e.source)}</span> &middot; ${esc(e.newsletter)} &middot; ${formatShort(e.date)}</div>
        <div class="card-summary">${highlight(e.summary, q)}</div>
        ${also}
      </article>`;
    }).join("");

    return `<div class="day-group">
      <div class="day-heading"><span>${formatLong(d)}</span><span class="day-count">${n} article${n !== 1 ? "s" : ""}</span></div>
      ${inlineHl}
      ${cards}
    </div>`;
  }).join("");
}

/* ================================================================
   INIT
   ================================================================ */
function init() {
  if (!BRIEF_DATA || BRIEF_DATA.length === 0) {
    document.getElementById("empty-state").style.display = "block";
    return;
  }

  renderSidebar();
  renderArticles();

  // Search input
  let debounce;
  document.getElementById("search-input").addEventListener("input", e => {
    clearTimeout(debounce);
    debounce = setTimeout(() => {
      state.query = e.target.value;
      renderArticles();
    }, 220);
  });

  // Time range
  document.querySelectorAll("input[name='range']").forEach(radio => {
    radio.addEventListener("change", e => {
      state.rangeDays = e.target.value === "all" ? null : parseInt(e.target.value, 10);
      renderSidebar();
      renderArticles();
    });
  });

  // Date select
  document.getElementById("date-select").addEventListener("change", e => {
    state.date = e.target.value;
    renderArticles();
  });

  // Clear all filters
  document.getElementById("clear-btn").addEventListener("click", () => {
    state.query = ""; state.rangeDays = null;
    state.date = ""; state.sources = null; state.categories = null;
    document.getElementById("search-input").value = "";
    document.querySelector("input[name='range'][value='all']").checked = true;
    renderSidebar();
    renderArticles();
  });

  // Source: all / none
  document.getElementById("src-all").addEventListener("click", e => {
    e.preventDefault();
    state.sources = null;
    renderSidebar();
    renderArticles();
  });
  document.getElementById("src-none").addEventListener("click", e => {
    e.preventDefault();
    state.sources = new Set();
    renderSidebar();
    renderArticles();
  });

  // Category: all / none
  document.getElementById("cat-all").addEventListener("click", e => {
    e.preventDefault();
    state.categories = null;
    renderSidebar();
    renderArticles();
  });
  document.getElementById("cat-none").addEventListener("click", e => {
    e.preventDefault();
    state.categories = new Set();
    renderSidebar();
    renderArticles();
  });
}

/* ================================================================
   MOBILE SIDEBAR TOGGLE
   ================================================================ */
function initMobileToggle() {
  const btn      = document.getElementById("filter-toggle");
  const sidebar  = document.getElementById("sidebar");
  const overlay  = document.getElementById("sidebar-overlay");

  function openSidebar() {
    sidebar.classList.add("sidebar-open");
    overlay.classList.add("sidebar-open");
    document.body.style.overflow = "hidden";
  }

  function closeSidebar() {
    sidebar.classList.remove("sidebar-open");
    overlay.classList.remove("sidebar-open");
    document.body.style.overflow = "";
  }

  btn.addEventListener("click", () => {
    sidebar.classList.contains("sidebar-open") ? closeSidebar() : openSidebar();
  });
  overlay.addEventListener("click", closeSidebar);

  // Close on Escape key
  document.addEventListener("keydown", e => {
    if (e.key === "Escape") closeSidebar();
  });

}

document.addEventListener("DOMContentLoaded", init);
document.addEventListener("DOMContentLoaded", initMobileToggle);
</script>
